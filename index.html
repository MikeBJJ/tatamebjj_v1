function buildDueDate(year,month,day){var lastDay=new Date(year,month,0).getDate();return new Date(year,month-1,Math.min(day,lastDay))}
function generateRecurringPayments(){

var students=DB.get('bjj_students')||[];
var payments=DB.get('bjj_payments')||[];
var today=new Date();
var cy=today.getFullYear(),cm=today.getMonth()+1;
var periodo=cy+'-'+String(cm).padStart(2,'0');
var changed=false;
for(var i=0;i<students.length;i++){
var s=students[i];
if(s.status!=='ativo')continue;
if(!s.monthlyValue||s.monthlyValue<=0)continue;
if(!s.dueDay)continue;
if(s.recurrenceActive===false)continue;
var dueDate=buildDueDate(cy,cm,s.dueDay);
if(dueDate>today&&dueDate.getMonth()!==today.getMonth())continue;
var enrollmentDate=new Date(s.enrollment);
if(dueDate<enrollmentDate)continue;
var jaExiste=payments.some(function(p){return p.studentId===s.id&&p.periodo===periodo});
if(jaExiste)continue;
var valorBase=parseFloat(s.monthlyValue);
var desconto=parseFloat(s.discountPercent||0);
var valorDesconto=valorBase*(desconto/100);
var valorFinal=valorBase-valorDesconto;
var newId=payments.length>0?Math.max.apply(null,payments.map(function(p){return p.id}))+1:1;
payments.push({id:newId,studentId:s.id,studentName:s.name,value:valorFinal,originalValue:valorBase,discountPercent:desconto,discountValue:valorDesconto,due:dueDate.toISOString().split('T')[0],periodo:periodo,status:'pendente',paidDate:'',method:'',plan:s.plan||'Mensal',autoGenerated:true,createdAt:today.toISOString().split('T')[0]});
changed=true;
}
if(changed)DB.set('bjj_payments',payments);
}catch(e){console.error('Erro ao gerar cobran\u00e7as:',e)}
}

function rAvisos(){document.getElementById('pageTitle').textContent='Avisos';var n=DB.get('bjj_notices')||[];var ids=getMyStudentIds();if(cu.role==='Aluno')n=n.filter(function(x){return x.target==='all'||ids.some(function(id){return x.target==='student:'+id})});var canCreate=AUTH.hr(['ADM','Professor']);var h='';if(canCreate)h='<div class="tb"><button class="btn b1" onclick="openNoticeModal()">+ Novo Aviso</button></div>';var un=n.filter(function(x){return !x.read}).length;h+='<div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center"><p style="color:var(--tm)">'+un+' n\u00e3o lidas de '+n.length+'</p><button class="btn b2 bs" onclick="markAllRead()">Marcar lidas</button></div>';if(n.length===0)h+='<div class="es"><p>Nenhuma notifica\u00e7\u00e3o.</p></div>';else for(var i=0;i<n.length;i++)h+='<div class="nc '+(!n[i].read?'ur':'')+'" onclick="readNotice('+n[i].id+')"><div style="flex:1"><div style="font-weight:600">'+n[i].title+(!n[i].read?'<span class="nb">Nova</span>':'')+'</div><div style="font-size:14px;color:var(--tm)">'+n[i].text+'</div><div style="font-size:12px;color:var(--tm);margin-top:4px">'+n[i].date+(n[i].target!=='all'?' \u2022 Direcionado':'')+'</div></div></div>';document.getElementById('pageContent').innerHTML=h}

function rRel(){if(!AUTH.hr(['ADM'])){rDash();return}document.getElementById('pageTitle').textContent='Relat\u00f3rios';var s=DB.get('bjj_students')||[],p=DB.get('bjj_payments')||[],a=DB.get('bjj_audit')||[];var act=s.filter(function(x){return x.status==='ativo'}).length;var paid=p.filter(function(x){return x.status==='paga'});var rev=paid.reduce(function(a,x){return a+(x.value||0)},0);var bd={};s.forEach(function(x){bd[x.belt]=(bd[x.belt]||0)+1});var mb=Math.max.apply(null,Object.values(bd).concat([1]));var h='<div class="sg"><div class="sc"><div class="sv">'+act+'</div><div class="sl">Ativos</div></div><div class="sc"><div class="sv">R$ '+rev.toFixed(0)+'</div><div class="sl">Receita</div></div></div>';h+='<div class="rp"><h3>Distribui\u00e7\u00e3o por Faixa</h3>';Object.keys(bd).forEach(function(b){h+='<div class="dash-bar"><span style="width:120px;font-size:13px"><span class="bdot" style="background:'+(BC[b]||'#888')+'"></span>'+b+'</span><div class="dash-bar-bg"><div class="dash-bar-fill" style="width:'+(bd[b]/mb*100)+'%;background:'+(BC[b]||'#888')+'"></div></div><span style="font-size:12px">'+bd[b]+'</span></div>'});h+='</div>';if(a.length>0){h+='<div class="rp"><h3>Auditoria de Altera\u00e7\u00f5es Financeiras</h3>';for(var i=a.length-1;i>=0&&i>=a.length-10;i--){h+='<div class="dash-item"><span style="font-size:13px">'+a[i].field+': '+(a[i].oldVal||'--')+' \u2192 '+(a[i].newVal||'--')+'</span><span style="font-size:12px;color:var(--tm)">'+a[i].user+' | '+a[i].date+'</span></div>'}h+='</div>'}h+='<div class="rp"><h3>Exportar</h3><button class="btn b2" onclick="exportCSV(\'alunos\')">Alunos CSV</button> <button class="btn b2" onclick="exportCSV(\'financeiro\')">Financeiro CSV</button></div>';document.getElementById('pageContent').innerHTML=h}
function exportCSV(type){var csv='';if(type==='alunos'){var s=DB.get('bjj_students')||[];csv='Nome,CPF,Faixa,Grau,Status,Mensalidade,Desconto,DiaVenc\n';s.forEach(function(x){csv+=x.name+','+x.cpf+','+x.belt+','+x.degree+','+x.status+','+(x.monthlyValue||'')+','+(x.discountPercent||0)+','+(x.dueDay||'')+'\n'})}else if(type==='financeiro'){var p=DB.get('bjj_payments')||[];csv='Aluno,Valor,Vencimento,Periodo,Status,Auto\n';p.forEach(function(x){csv+=x.studentName+','+(x.value||0)+','+x.due+','+(x.periodo||'')+','+x.status+','+(x.autoGenerated?'Sim':'Nao')+'\n'})}var b=new Blob([csv],{type:'text/csv;charset=utf-8;'});var l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='relatorio.csv';l.click();toast('Exportado!','ok')}
function rWL(){if(!AUTH.hr(['ADM'])){rDash();return}document.getElementById('pageTitle').textContent='White Label';var b=DB.get('bjj_branding')||{};document.getElementById('pageContent').innerHTML='<div class="wlp" style="background:linear-gradient(135deg,'+b.primaryColor+'22,'+b.secondaryColor+'22)"><div class="wlpn" style="color:'+b.primaryColor+'">'+(b.academyName||'Academia')+'</div><div style="color:var(--tm)">'+(b.teamName||'')+'</div></div><div class="rp"><h3>Identidade Visual</h3><form onsubmit="saveBranding(event)" style="display:block"><div class="fr"><div class="fg"><label>Nome*</label><input type="text" name="academyName" value="'+(b.academyName||'')+'" required></div><div class="fg"><label>Equipe</label><input type="text" name="teamName" value="'+(b.teamName||'')+'"></div></div><div class="wlc"><div><label>Cor Prim\u00e1ria</label><input type="color" name="primaryColor" value="'+(b.primaryColor||'#e94560')+'" oninput="updatePrev(this)"></div><div><label>Cor Secund\u00e1ria</label><input type="color" name="secondaryColor" value="'+(b.secondaryColor||'#f9c80e')+'" oninput="updatePrev(this)"></div></div><button type="submit" class="btn b1">Salvar</button></form></div>'}
function updatePrev(input){var f=input.closest('form');var pv=document.querySelector('.wlp');if(pv){pv.style.background='linear-gradient(135deg,'+f.primaryColor.value+'22,'+f.secondaryColor.value+'22)';pv.querySelector('.wlpn').style.color=f.primaryColor.value}}
function saveBranding(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v});DB.set('bjj_branding',Object.assign(DB.get('bjj_branding')||{},d));applyBranding();toast('Salvo!','ok')}
function rCfg(){if(!AUTH.hr(['ADM'])){rDash();return}document.getElementById('pageTitle').textContent='Configura\u00e7\u00f5es';var u=DB.get('bjj_users')||[];var h='<div class="rp"><h3>Usu\u00e1rios do Sistema</h3><table><thead><tr><th>Usu\u00e1rio</th><th>Nome</th><th>Perfil</th><th>A\u00e7\u00f5es</th></tr></thead><tbody>';for(var i=0;i<u.length;i++)h+='<tr><td><strong>'+u[i].username+'</strong></td><td>'+u[i].name+'</td><td><span class="bg ba">'+u[i].role+'</span></td><td>'+(u[i].id!==cu.id?'<button class="btn bd2 bs" onclick="deleteUser('+u[i].id+')">Excluir</button>':'Voc\u00ea')+'</td></tr>';h+='</tbody></table><button class="btn b1" style="margin-top:16px" onclick="openUserModal()">+ Novo Usu\u00e1rio</button></div>';document.getElementById('pageContent').innerHTML=h}
function openUserModal(){document.getElementById('modalContent').innerHTML='<h2>Novo Usu\u00e1rio</h2><form onsubmit="saveUser(event)" style="display:block"><div class="fg"><label>Usu\u00e1rio*</label><input type="text" name="username" required></div><div class="fg"><label>Nome*</label><input type="text" name="name" required></div><div class="fr"><div class="fg"><label>Senha*</label><input type="text" name="password" required></div><div class="fg"><label>Perfil</label><select name="role"><option value="ADM">ADM</option><option value="Professor">Professor</option></select></div></div><div class="ma"><button type="button" class="btn b2" onclick="closeModal()">Cancelar</button><button type="submit" class="btn b1">Criar</button></div></form>';document.getElementById('modalOverlay').classList.add('ac')}
function saveUser(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v});var u=DB.get('bjj_users')||[];d.id=u.length?Math.max.apply(null,u.map(function(x){return x.id}))+1:1;d.photo='';u.push(d);DB.set('bjj_users',u);closeModal();rCfg();toast('Usu\u00e1rio criado!','ok')}
function deleteUser(id){if(!confirm('Excluir?'))return;DB.set('bjj_users',(DB.get('bjj_users')||[]).filter(function(x){return x.id!==id}));rCfg();toast('Exclu\u00eddo.','ok')}
function rPerf(){document.getElementById('pageTitle').textContent='Meu Perfil';var isAluno=cu.role==='Aluno';var student=isAluno?(DB.get('bjj_students')||[]).find(function(s){return s.id===cu.studentId}):null;var photo=cu.photo||(student&&student.photo)||'';var cpf=cu.username.length===11?fmtCPF(cu.username):cu.username;var h='<div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap"><div class="pa2" onclick="openPhotoUpload()">'+(photo?'<img src="'+photo+'">':'<span style="font-size:36px;color:var(--tm)">'+cu.name.charAt(0)+'</span>')+'</div><div><h2>'+cu.name+'</h2><p style="color:var(--tm)">'+cu.role+'</p></div></div>';h+='<div class="rp"><h3>Meus Dados</h3><form onsubmit="saveProfile(event)" style="display:block"><div class="fg"><label>Nome*</label><input type="text" name="name" value="'+cu.name+'" required></div>';if(isAluno){h+='<div class="fg"><label>CPF (bloqueado)</label><input type="text" value="'+cpf+'" readonly></div><div class="fg"><label>Celular</label><input type="text" name="phone" value="'+(student?fmtPhone(student.phone||''):'')+'" oninput="this.value=fmtPhone(this.value)"></div><div class="fg"><label>E-mail</label><input type="email" name="email" value="'+(cu.email||'')+'"></div><div class="fg"><label>Endere\u00e7o</label><input type="text" name="address" value="'+(student?student.address||'':'')+'"></div>'}else{h+='<div class="fg"><label>Usu\u00e1rio (bloqueado)</label><input type="text" value="'+cu.username+'" readonly></div><div class="fg"><label>E-mail</label><input type="email" name="email" value="'+(cu.email||'')+'"></div>'}h+='<button type="submit" class="btn b1">Salvar</button></form></div>';h+='<div class="rp"><h3>Alterar Senha</h3><form onsubmit="changePass(event)" style="display:block"><div class="fg"><label>Senha Atual</label><input type="password" name="oldPass" required></div><div class="fr"><div class="fg"><label>Nova Senha (m\u00edn. 6)</label><input type="password" name="newPass" minlength="6" required></div><div class="fg"><label>Confirmar</label><input type="password" name="confPass" required></div></div><div class="ma"><button type="submit" class="btn b1">Alterar Senha</button></div></form></div>';document.getElementById('pageContent').innerHTML=h}
function saveProfile(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v});var u=DB.get('bjj_users')||[];var ui=u.findIndex(function(x){return x.id===cu.id});if(ui>=0){u[ui].name=d.name;u[ui].email=d.email;DB.set('bjj_users',u);cu=u[ui]}if(cu.role==='Aluno'){var st=DB.get('bjj_students')||[];var si=st.findIndex(function(x){return x.id===cu.studentId});if(si>=0){st[si].name=d.name;if(d.phone)st[si].phone=d.phone;st[si].email=d.email;if(d.address)st[si].address=d.address;DB.set('bjj_students',st)}}updateAvatar();renderMenu();toast('Perfil atualizado!','ok')}
function changePass(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v});if(d.oldPass!==cu.password){toast('Senha atual incorreta','error');return}if(d.newPass!==d.confPass){toast('Confirma\u00e7\u00e3o n\u00e3o confere','error');return}if(d.newPass.length<6){toast('Nova senha muito curta','error');return}var u=DB.get('bjj_users')||[];var ui=u.findIndex(function(x){return x.id===cu.id});u[ui].password=d.newPass;DB.set('bjj_users',u);cu=u[ui];e.target.reset();toast('Senha alterada!','ok')}
function openPhotoUpload(){document.getElementById('modalContent').innerHTML='<h2>Foto de Perfil</h2><p style="color:var(--tm);margin-bottom:16px">Escolha como enviar:</p><div class="uo"><label class="ub2">Importar da Galeria<input type="file" accept="image/*" style="display:none" onchange="handleProfilePhoto(event)"></label><label class="ub2">Abrir C\u00e2mera<input type="file" accept="image/*" capture="user" style="display:none" onchange="handleProfilePhoto(event)"></label></div><div class="ma"><button class="btn b2" onclick="closeModal()">Cancelar</button></div>';document.getElementById('modalOverlay').classList.add('ac')}
function handleProfilePhoto(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var u=DB.get('bjj_users')||[];var ui=u.findIndex(function(x){return x.id===cu.id});if(ui>=0){u[ui].photo=ev.target.result;DB.set('bjj_users',u);cu=u[ui]}if(cu.role==='Aluno'){var st=DB.get('bjj_students')||[];var si=st.findIndex(function(x){return x.id===cu.studentId});if(si>=0){st[si].photo=ev.target.result;DB.set('bjj_students',st)}}closeModal();updateAvatar();rPerf();toast('Foto atualizada!','ok')};r.readAsDataURL(f)}
/* ===== SECTION 27: LOGIN/LOGOUT ===== */
function doLogin(){var u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(AUTH.login(u,p)){document.getElementById('loginScreen').style.display='none';document.getElementById('appLayout').classList.add('at');renderMenu();navigate('dashboard')}else{document.getElementById('loginError').style.display='block'}}
function logout(){AUTH.logout();document.getElementById('appLayout').classList.remove('at');document.getElementById('loginScreen').style.display='flex';document.getElementById('loginUser').value='';document.getElementById('loginPass').value='';document.getElementById('ctxSelector').style.display='none'}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target.id==='modalOverlay')closeModal()});
/* ===== SECTION 28: INIT ===== */
DB.init();
generateRecurringPayments();
</script>
