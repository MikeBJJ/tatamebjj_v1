<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatame BJJ - Sistema de Gestão para Academia de Jiu-Jitsu</title>
<style>
:root{
  --primary:#e94560; --secondary:#f9c80e; --bg:#1a1a2e; --card:#16213e;
  --card2:#1f2a4a; --text:#e6e6f0; --muted:#9aa0b8; --border:#2a3556;
  --ok:#2ecc71; --warn:#f39c12; --danger:#e94560; --radius:12px;
  --sidebar-w:250px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:50;display:flex;flex-direction:column;transition:transform .25s ease}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid var(--border)}
.brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo svg{width:22px;height:22px;stroke:#fff}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.5px}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:14px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500;transition:all .15s;width:100%;text-align:left;margin-bottom:2px}
.nav-item svg{width:18px;height:18px;flex-shrink:0;stroke-width:2}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(233,69,96,.18),transparent);color:var(--primary);border-left:3px solid var(--primary)}
.nav-item .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:18px;text-align:center}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.user-mini{display:flex;align-items:center;gap:10px}
.user-info{flex:1;min-width:0}
.user-info strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info span{font-size:11px;color:var(--muted)}
.logout-btn{color:var(--danger);padding:6px}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.hamburger{display:none;color:var(--text);padding:4px}
.topbar h2{font-size:18px;font-weight:700;flex:1}
.topbar .sub{font-size:12px;color:var(--muted)}
.content{padding:24px;flex:1}
.avatar{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;color:var(--primary)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .field{flex:1;min-width:180px}
.toolbar-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar-row .field{min-width:160px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;transition:all .15s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-gold{background:var(--secondary);color:#1a1a2e}
.btn-gold:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--card2)}
.btn-danger{background:rgba(233,69,96,.15);color:var(--danger);border-color:rgba(233,69,96,.3)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ok{background:rgba(46,204,113,.15);color:var(--ok);border-color:rgba(46,204,113,.3)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid rgba(42,53,86,.5);vertical-align:middle}
tbody tr:hover{background:var(--card2)}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag-ok{background:rgba(46,204,113,.15);color:var(--ok)}
.tag-warn{background:rgba(243,156,18,.15);color:var(--warn)}
.tag-danger{background:rgba(233,69,96,.15);color:var(--danger)}
.tag-gold{background:rgba(249,200,14,.15);color:var(--secondary)}
.tag-blue{background:rgba(52,152,219,.15);color:#3498db}
.tag-muted{background:var(--card2);color:var(--muted)}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .value{font-size:26px;font-weight:800}
.stat-card .sub{font-size:12px;color:var(--muted)}
.stat-card .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-card .icon svg{width:20px;height:20px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,10,20,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal:not(.no-anim){animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{color:var(--muted);padding:4px}
.modal-close:hover{color:var(--danger)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#1f2a4a,var(--bg) 60%);padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:38px 34px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-logo svg{width:34px;height:34px;stroke:#fff}
.login-card h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.login-card .field{margin-bottom:14px}
.login-card .btn{margin-top:6px}
.login-hint{margin-top:18px;background:var(--card2);border-radius:9px;padding:12px;font-size:11px;color:var(--muted);line-height:1.7}
.login-hint b{color:var(--secondary)}

.alert{padding:12px 16px;border-radius:9px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.alert-info{background:rgba(52,152,219,.12);color:#7fb8e0;border:1px solid rgba(52,152,219,.25)}
.alert-warn{background:rgba(243,156,18,.12);color:#f5c06a;border:1px solid rgba(243,156,18,.25)}
.alert-ok{background:rgba(46,204,113,.12);color:#7fdca8;border:1px solid rgba(46,204,113,.25)}
.alert-danger{background:rgba(233,69,96,.12);color:#f08a9c;border:1px solid rgba(233,69,96,.25)}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;padding:13px 16px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:slideIn .2s ease;min-width:260px;max-width:360px}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.danger{border-left-color:var(--danger)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

.belt-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--card2);font-size:13px;font-weight:700}
.belt-bar{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex-shrink:0}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.prod-img{height:150px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-img .ph{color:var(--muted);font-size:12px;text-align:center;padding:10px}
.prod-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:6px}
.prod-body h4{font-size:14px}
.prod-body .price{font-size:18px;font-weight:800;color:var(--secondary)}
.prod-body .stock{font-size:12px;color:var(--muted)}
.prod-body .btn{margin-top:auto}

.raffle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.raffle-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--border);transition:all .15s}
.raffle-cell:hover{border-color:var(--primary)}
.raffle-cell.sold{background:rgba(233,69,96,.2);color:var(--danger);border-color:rgba(233,69,96,.3);cursor:not-allowed}
.raffle-cell.mine{background:rgba(249,200,14,.2);color:var(--secondary);border-color:var(--secondary)}
.raffle-cell.winner{background:var(--ok);color:#fff;border-color:var(--ok)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:16px 0}
.tl-item::before{content:'';position:absolute;left:-23px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card2);border:3px solid var(--primary)}
.tl-item .tl-date{font-size:12px;color:var(--muted)}
.tl-item .tl-title{font-weight:700;font-size:14px;margin:2px 0}
.tl-item .tl-desc{font-size:13px;color:var(--muted)}

.notice{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--card)}
.notice.unread{border-left:3px solid var(--primary);background:var(--card2)}
.notice .n-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notice .n-title{font-weight:700;font-size:14px}
.notice .n-date{font-size:11px;color:var(--muted);margin-left:auto}
.notice .n-body{font-size:13px;color:var(--muted);line-height:1.5}

.partner-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.partner-card.sponsor{border-color:var(--secondary);box-shadow:0 0 0 1px rgba(249,200,14,.3)}
.partner-card .p-logo{width:52px;height:52px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--secondary);overflow:hidden}
.partner-card .p-logo img{width:100%;height:100%;object-fit:cover}
.partner-card h4{font-size:14px}
.partner-card .p-cat{font-size:11px;color:var(--muted);margin-top:-4px}
.sponsor-tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;color:#1a1a2e;background:var(--secondary);padding:3px 8px;border-radius:20px;letter-spacing:.5px}

.avatar-upload{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.avatar-upload .big{width:76px;height:76px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;flex-shrink:0}
.avatar-upload .big img{width:100%;height:100%;object-fit:cover}
.avatar-actions{display:flex;flex-direction:column;gap:8px}
.avatar-actions .btn{font-size:12px}

.color-input{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 12px}
.color-input input[type=color]{width:40px;height:34px;border:none;padding:0;background:none;cursor:pointer}
.color-input span{font-size:13px;color:var(--muted)}

.pix-box{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px dashed var(--secondary);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.freq-track{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.freq-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ok),var(--secondary))}

.dash{display:flex;flex-direction:column;gap:18px}
.dash-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.dash-toolbar .filters{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.dash-toolbar .field{min-width:150px}
.dash-toolbar .field label{font-size:10px}
.dash-toolbar .refresh{margin-left:auto}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-c,var(--primary))}
.kpi .k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-value{font-size:28px;font-weight:800;line-height:1}
.kpi .k-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kpi .spark{position:absolute;right:14px;bottom:14px;opacity:.85}
.dash-grid{display:grid;gap:16px}
.dash-grid.cols-2{grid-template-columns:1.6fr 1fr}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0}
.panel-head h3 svg{width:16px;height:16px;color:var(--primary)}
.panel-head .hint{font-size:11px;color:var(--muted)}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.chart-legend .lg{display:flex;align-items:center;gap:5px}
.chart-legend .dot{width:9px;height:9px;border-radius:3px}
.chart-tip{font-size:11px;color:var(--muted);text-align:center;padding:20px 0}
.axis-label{font-size:10px;fill:var(--muted)}
.grid-line{stroke:var(--border);stroke-width:1}
.bar-cell{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-cell .bc-label{width:130px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-cell .bc-track{flex:1;height:22px;background:var(--card2);border-radius:6px;overflow:hidden;position:relative}
.bar-cell .bc-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:700;color:#fff;min-width:34px;transition:width .5s ease}
.bar-cell .bc-val{width:40px;text-align:right;font-size:12px;font-weight:700}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}.dash-grid.cols-2{grid-template-columns:1fr}}
@media(max-width:600px){.kpi-row{grid-template-columns:1fr}}

@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.5)}
  .main{margin-left:0}
  .hamburger{display:block}
  .content{padding:16px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .topbar{padding:12px 16px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none}
  .overlay.show{display:block}
}
@media(max-width:480px){
  .stat-card .value{font-size:22px}
  .prod-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="loginView" class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>
    </div>
    <h1>Tatame BJJ</h1>
    <p>Sistema de Gestão para Academia de Jiu-Jitsu</p>
    <div class="field">
      <label>Usuário (CPF ou login)</label>
      <input type="text" id="loginUser" placeholder="Ex.: admin ou 12345678901" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Entrar</button>
    <div id="loginError"></div>
    <div class="login-hint">
      <b>Contas de demonstração:</b><br>
      ADM - admin / 123456<br>
      Professor Líder - lider / 123456<br>
      Professor - professor / 123456<br>
      Aluno - aluno / 123456 (João Silva)
    </div>
    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="resetarDemo()">Restaurar dados de demonstração</button>
  </div>
</div>

<div id="appView" class="app" style="display:none">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg></div>
      <div><h1>Tatame BJJ</h1><small id="wlTagline">SISTEMA DE GESTÃO</small></div>
    </div>
    <nav class="nav" id="navMenu"></nav>

function ultimoDiaDoMes(mes){
  const p = String(mes).split('-').map(Number);
  if(!p[0]||!p[1]) return mes;
  return isoLocal(new Date(p[0], p[1], 0));
}
function cortePeriodo(periodo){
  if(periodo==='todos') return '0000-01-01';
  const dias = periodo==='7d'?7 : periodo==='90d'?90 : 30;
  return isoLocal(new Date(Date.now()-dias*86400000));
}
function periodoLabel(periodo){
  return periodo==='7d'?'Últimos 7 dias': periodo==='90d'?'Últimos 90 dias': periodo==='todos'?'Todo o histórico':'Últimos 30 dias';
}

/* Máscara de celular (RF-01) */
function maskCelular(value){
  let d = String(value||'').replace(/\D/g,'').slice(0,11);
  if(!d) return '';
  if(d.length<=2) return '('+d;
  if(d.length<=7) return '('+d.slice(0,2)+') '+d.slice(2);
  return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}
function celularValido(value){
  const d = String(value||'').replace(/\D/g,'');
  return d.length===11 && d[2]==='9';
}
function maskCPF(value){
  let d = String(value||'').replace(/\D/g,'').slice(0,11);
  if(d.length<=3) return d;
  if(d.length<=6) return d.slice(0,3)+'.'+d.slice(3);
  if(d.length<=9) return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6);
  return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9);
}
function validarCPF(cpf){
  let c = String(cpf||'').replace(/\D/g,'');
  if(c.length!==11) return false;
  if(/^(\d)\1{10}$/.test(c)) return false;
  let soma=0, i;
  for(i=0;i<9;i++) soma+=parseInt(c[i])*(10-i);
  let r1=(soma*10)%11; if(r1===10) r1=0; if(r1!==parseInt(c[9])) return false;
  soma=0; for(i=0;i<10;i++) soma+=parseInt(c[i])*(11-i);
  let r2=(soma*10)%11; if(r2===10) r2=0; if(r2!==parseInt(c[10])) return false;
  return true;
}

const FAIXAS_IBJJF = {
  'Branca': {hex:'#e8e8e8', min:4},
  'Cinza': {hex:'#9e9e9e', min:4},
  'Amarela': {hex:'#f1c40f', min:7},
  'Laranja': {hex:'#e67e22', min:10},
  'Verde': {hex:'#27ae60', min:13},
  'Azul': {hex:'#2e86de', min:16},
  'Roxa': {hex:'#8e44ad', min:16},
  'Marrom': {hex:'#6d4c41', min:18},
  'Preta': {hex:'#111111', min:19}
};
const FAIXAS_INFANTIS = ['Branca','Cinza','Amarela','Laranja','Verde'];
const FAIXAS_ADULTAS = ['Azul','Roxa','Marrom','Preta'];
const FAIXA_ORDEM = ['Branca','Cinza','Amarela','Laranja','Verde','Azul','Roxa','Marrom','Preta'];
function idadeDe(nascimento){
  if(!nascimento) return null;
  const n = new Date(nascimento + 'T00:00:00');
  const hoje = new Date();
  let idade = hoje.getFullYear() - n.getFullYear();
  const m = hoje.getMonth() - n.getMonth();
  if(m<0 || (m===0 && hoje.getDate()<n.getDate())) idade--;
  return idade;
}
function faixaInfo(aluno){
  const f = FAIXAS_IBJJF[aluno.faixa] || {hex:'#e8e8e8'};
  return {faixa:aluno.faixa, hex:f.hex, graus:Number(aluno.graus||0)};
}

function doLogin(){
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.innerHTML='';
  let users = DB.get('users')||[];
  if(!users.length || !users.some(x=>['admin','professor','aluno','lider'].includes((x.login||'').toLowerCase()))){
    DB.reset();
    users = DB.get('users')||[];
  }
  if(!users.length){
    err.innerHTML = '<div class="alert alert-danger" style="margin-top:12px">'+icon('warn')+'<div>Não foi possível acessar o armazenamento local do navegador. Habilite cookies/armazenamento e recarregue a página.</div></div>';
    return;
  }
  let user = users.find(x=>x.login && x.login.toLowerCase()===u);
  if(!user){
    const al = (DB.get('alunos')||[]).find(a=>a.cpf && a.cpf.replace(/\D/g,'')===u.replace(/\D/g,''));
    if(al) user = users.find(x=>x.alunoId===al.id);
  }
  if(!user || user.senha!==p){
    err.innerHTML = '<div class="alert alert-danger" style="margin-top:12px">'+icon('warn')+'<div>Usuário ou senha inválidos.</div></div>';
    return;
  }
  Session.set(user);
  current.depId = null;
  document.getElementById('loginView').style.display='none';
  document.getElementById('appView').style.display='flex';
  applyWhiteLabel();
  renderNav();
  go('dashboard');
}

  Session.clear();
  document.getElementById('appView').style.display='none';
  document.getElementById('loginView').style.display='flex';
  document.getElementById('loginPass').value='';
}

   FINANCEIRO - cobranças unificadas + Pix
   ============================================================ */
function todasCobrancas(){
  const alunos = DB.get('alunos')||[];
  const mensalidades = DB.get('mensalidades')||[];
  const pedidos = DB.get('pedidos')||[];
  const bilhetes = DB.get('bilhetes')||[];
  const rifas = DB.get('rifas')||[];
  const cobrancas = DB.get('cobrancas')||[];
  const lista = [];
  mensalidades.forEach(m=>{
    const a = alunos.find(x=>x.id===m.alunoId);
    lista.push({
      id:'m_'+m.id, tipo:'mensalidade', alunoId:m.alunoId, aluno:a?a.nome:'-',
      descricao:'Mensalidade '+m.mes, valor:m.valor, status:m.status,
      referencia:m.mes, vencimento:ultimoDiaDoMes(m.mes)
    });
  });
  pedidos.forEach(p=>{
    const a = alunos.find(x=>x.id===p.alunoId);
    const pago = p.status==='pago'||p.status==='entregue'||p.status==='enviado';
    lista.push({
      id:'p_'+p.id, tipo:'loja', alunoId:p.alunoId, aluno:a?a.nome:'-',
      descricao:'Compra na loja #'+String(p.id).slice(-5).toUpperCase(), valor:p.total,
      status: pago?'pago':'aberto', referencia:p.data, vencimento:p.data
    });
  });
  bilhetes.filter(b=>b.alunoId).forEach(b=>{
    const r = rifas.find(x=>x.id===b.rifaId);
    const a = alunos.find(x=>x.id===b.alunoId);
    if(r) lista.push({
      id:'b_'+b.id, tipo:'rifa', alunoId:b.alunoId, aluno:a?a.nome:'-',
      descricao:'Cota rifa '+r.titulo+' (nº '+b.numero+')', valor:r.preco,
      status: b.pago?'pago':'aberto', referencia:r.criadoEm, vencimento:r.criadoEm
    });
  });
  cobrancas.forEach(c=>{
    const a = alunos.find(x=>x.id===c.alunoId);
    lista.push({
      id:'c_'+c.id, tipo:'avulsa', alunoId:c.alunoId, aluno:a?a.nome:'-',
      descricao:c.descricao, valor:c.valor, status:c.status,
      referencia:c.vencimento, vencimento:c.vencimento
    });
  });
  return lista;
}
function statusCobranca(c){
  if(c.status==='pago') return {key:'pago', label:'Pago', cls:'tag-ok'};
  if(c.status==='isento') return {key:'isento', label:'Isento', cls:'tag-gold'};
  const hoje = hojeISO();
  const mesAtual = hoje.slice(0,7);
  if(c.tipo==='mensalidade'){
    if(c.referencia > mesAtual) return {key:'avencer', label:'À vencer', cls:'tag-blue'};
    if(c.referencia === mesAtual) return {key:'pendente', label:'Pendente', cls:'tag-warn'};
    return {key:'vencido', label:'Vencido', cls:'tag-danger'};
  }
  if(c.tipo==='avulsa'){
    const venc = c.vencimento||'';
    if(!venc) return {key:'pendente', label:'Pendente', cls:'tag-warn'};
    if(venc > hoje) return {key:'avencer', label:'À vencer', cls:'tag-blue'};
    if(venc === hoje) return {key:'pendente', label:'Pendente', cls:'tag-warn'};
    return {key:'vencido', label:'Vencido', cls:'tag-danger'};
  }
  return {key:'pendente', label:'Pendente', cls:'tag-warn'};
}
function cobrancaVencida(c){ return statusCobranca(c).key==='vencido'; }

function pixBar(){
  const chave = (DB.get('config')||{}).pixKey||'';
  if(!chave) return '';
  return '<div class="pix-box">'+icon('financeiro',16)+'<span style="flex:1"><b>Pagamento via Pix:</b> '+esc(chave)+'</span><button class="btn btn-gold btn-sm" onclick="copiarPix()">'+icon('copy',13)+' Copiar chave</button></div>';
}
function copiarPix(){
  const chave = (DB.get('config')||{}).pixKey||'';
  if(!chave){ toast('Chave Pix não cadastrada.','warn'); return; }
  const ok = ()=>toast('Chave Pix copiada!','ok');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(chave).then(ok).catch(()=>{ fallbackCopy(chave); ok(); }); }
  else { fallbackCopy(chave); ok(); }
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

/* ============ NOTIFICAÇÃO DE COBRANÇAS VENCIDAS ============ */
function notifVencidas(alunoId){
  let cobrancas = todasCobrancas();
  if(alunoId) cobrancas = cobrancas.filter(c=>c.alunoId===alunoId);
  const vencidas = cobrancas.filter(cobrancaVencida);
  if(!vencidas.length) return '';
  const total = vencidas.reduce((s,c)=>s+c.valor,0);
  const rows = vencidas.slice(0,5).map(c=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(233,69,96,.15);font-size:12px"><span>'+esc(c.aluno)+' - '+esc(c.descricao)+'</span><b>'+money(c.valor)+'</b></div>').join('');
  const extra = vencidas.length>5 ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">+ '+(vencidas.length-5)+' outra(s)</div>' : '';

/* ============ HELPERS DE AGENDA / FREQUÊNCIA ============ */
function proximasAulas(turmas, limite){
  const hoje = new Date();
  const diaHoje = hoje.getDay();
  const lista = (turmas||[]).map(t=>{
    const delta = ((Number(t.dia)-diaHoje)+7)%7;
    const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()+delta);
    return {t, delta, data: isoLocal(d)};
  });
  lista.sort((a,b)=> (a.delta-b.delta) || String(a.t.hora||'').localeCompare(String(b.t.hora||'')));
  return lista.slice(0, limite||6);
}
function freqAlunoStats(alunoId, presencas, periodo){
  const corte = cortePeriodo(periodo);
  const regs = (presencas||[]).filter(p=>p.alunoId===alunoId && p.data>=corte);
  const pres = regs.filter(p=>p.presente).length;
  const faltas = regs.length-pres;
  const taxa = regs.length?Math.round(pres/regs.length*100):0;
  const ultima = (presencas||[]).filter(p=>p.alunoId===alunoId && p.presente).sort((a,b)=>b.data.localeCompare(a.data))[0];
  return {pres, faltas, total:regs.length, taxa, ultima};
}
function semanasAluno(alunoId, presencas, n){
  const hoje = new Date();
  const out = [];
  const dow = (hoje.getDay()+6)%7;
  for(let i=n-1;i>=0;i--){
    const ini = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()-dow-i*7);
    const fim = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate()+6);
    const iniIso = isoLocal(ini), fimIso = isoLocal(fim);
    const cnt = (presencas||[]).filter(p=>p.alunoId===alunoId && p.presente && p.data>=iniIso && p.data<=fimIso).length;
    out.push({rot: ddmm(ini), cnt, iniIso});
  }
  return out;
}
function situacaoFinanceiraAluno(alunoId){
  const cs = todasCobrancas().filter(c=>c.alunoId===alunoId);
  const abertas = cs.filter(c=>c.status!=='pago' && c.status!=='isento');
  const totalAberto = abertas.reduce((s,c)=>s+c.valor,0);
  const pago = cs.filter(c=>c.status==='pago').reduce((s,c)=>s+c.valor,0);
  const vencidas = abertas.filter(cobrancaVencida);
  const proxima = abertas.slice().sort((a,b)=>String(a.vencimento||'').localeCompare(String(b.vencimento||'')))[0];
  return {totalAberto, pago, inad:vencidas.length>0, vencidas, proxima, abertas:abertas.length};
}

/* ---------- KPI CARD ---------- */
function kpiCard(label, value, ic, color, foot, spark){
  return '<div class="kpi" style="--kpi-c:'+color+'">'
    +'<div class="k-label">'+icon(ic,14)+esc(label)+'</div>'
    +'<div class="k-value">'+value+'</div>'
    +'<div class="k-foot">'+esc(foot||'')+'</div>'
    +'<svg class="spark" width="80" height="30" viewBox="0 0 80 30">'+sparkSvg(spark,color)+'</svg>'
    +'</div>';
}
function sparkSvg(arr, color){
  if(!arr||arr.length<2) return '';
  const w=80,h=30,pad=3;
  const min=Math.min(...arr),max=Math.max(...arr);
  const rng=(max-min)||1;
  const pts=arr.map((v,i)=>[(pad+(w-2*pad)*i/(arr.length-1)).toFixed(1), (h-pad-(h-2*pad)*(v-min)/rng).toFixed(1)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=pts[0][0]+','+h+' '+line+' '+pts[pts.length-1][0]+','+h;
  return '<polygon points="'+area+'" fill="'+color+'" opacity="0.12"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
}
function receitaLineChart(mensalidades, pedidos, corte){
  const meses = [];
  const d = new Date(corte+'T00:00:00');
  for(let i=0;i<6;i++){
    const m = new Date(d.getFullYear(), d.getMonth()+i, 1);
    meses.push({chave:m.toISOString().slice(0,7), rot:m.toLocaleDateString('pt-BR',{month:'short'})});
  }
  const valores = meses.map(m=>{
    const ms = mensalidades.filter(x=>x.mes===m.chave&&x.status==='pago').reduce((s,x)=>s+x.valor,0);
    const pd = pedidos.filter(p=>p.data.startsWith(m.chave)).reduce((s,p)=>s+p.total,0);
    return ms+pd;
  });
  const max = Math.max(...valores,1);
  const w=560,h=200,padL=46,padB=26,padT=14,padR=12;
  const iw=w-padL-padR, ih=h-padT-padB;
  let grid='';
  for(let i=0;i<=4;i++){
    const y=padT+ih*i/4;
    const val=Math.round(max*(4-i)/4);
    grid+='<line class="grid-line" x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'"
