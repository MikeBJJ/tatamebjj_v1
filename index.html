<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatame BJJ - Sistema de Gestão para Academia de Jiu-Jitsu</title>
<style>
:root{
  --primary:#e94560; --secondary:#f9c80e; --bg:#1a1a2e; --card:#16213e;
  --card2:#1f2a4a; --text:#e6e6f0; --muted:#9aa0b8; --border:#2a3556;
  --ok:#2ecc71; --warn:#f39c12; --danger:#e94560; --radius:12px;
  --sidebar-w:250px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:50;display:flex;flex-direction:column;transition:transform .25s ease}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid var(--border)}
.brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo svg{width:22px;height:22px;stroke:#fff}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.5px}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:14px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500;transition:all .15s;width:100%;text-align:left;margin-bottom:2px}
.nav-item svg{width:18px;height:18px;flex-shrink:0;stroke-width:2}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(233,69,96,.18),transparent);color:var(--primary);border-left:3px solid var(--primary)}
.nav-item .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:18px;text-align:center}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.user-mini{display:flex;align-items:center;gap:10px}
.user-info{flex:1;min-width:0}
.user-info strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info span{font-size:11px;color:var(--muted)}
.logout-btn{color:var(--danger);padding:6px}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.hamburger{display:none;color:var(--text);padding:4px}
.topbar h2{font-size:18px;font-weight:700;flex:1}
.topbar .sub{font-size:12px;color:var(--muted)}
.content{padding:24px;flex:1}
.avatar{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;color:var(--primary)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .field{flex:1;min-width:180px}
.toolbar-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar-row .field{min-width:160px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;transition:all .15s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-gold{background:var(--secondary);color:#1a1a2e}
.btn-gold:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--card2)}
.btn-danger{background:rgba(233,69,96,.15);color:var(--danger);border-color:rgba(233,69,96,.3)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ok{background:rgba(46,204,113,.15);color:var(--ok);border-color:rgba(46,204,113,.3)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid rgba(42,53,86,.5);vertical-align:middle}
tbody tr:hover{background:var(--card2)}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag-ok{background:rgba(46,204,113,.15);color:var(--ok)}
.tag-warn{background:rgba(243,156,18,.15);color:var(--warn)}
.tag-danger{background:rgba(233,69,96,.15);color:var(--danger)}
.tag-gold{background:rgba(249,200,14,.15);color:var(--secondary)}
.tag-blue{background:rgba(52,152,219,.15);color:#3498db}
.tag-muted{background:var(--card2);color:var(--muted)}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .value{font-size:26px;font-weight:800}
.stat-card .sub{font-size:12px;color:var(--muted)}
.stat-card .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-card .icon svg{width:20px;height:20px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,10,20,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal:not(.no-anim){animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{color:var(--muted);padding:4px}
.modal-close:hover{color:var(--danger)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#1f2a4a,var(--bg) 60%);padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:38px 34px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-logo svg{width:34px;height:34px;stroke:#fff}
.login-card h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.login-card .field{margin-bottom:14px}
.login-card .btn{margin-top:6px}
.login-hint{margin-top:18px;background:var(--card2);border-radius:9px;padding:12px;font-size:11px;color:var(--muted);line-height:1.7}
.login-hint b{color:var(--secondary)}

.alert{padding:12px 16px;border-radius:9px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.alert-info{background:rgba(52,152,219,.12);color:#7fb8e0;border:1px solid rgba(52,152,219,.25)}
.alert-warn{background:rgba(243,156,18,.12);color:#f5c06a;border:1px solid rgba(243,156,18,.25)}
.alert-ok{background:rgba(46,204,113,.12);color:#7fdca8;border:1px solid rgba(46,204,113,.25)}
.alert-danger{background:rgba(233,69,96,.12);color:#f08a9c;border:1px solid rgba(233,69,96,.25)}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;padding:13px 16px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:slideIn .2s ease;min-width:260px;max-width:360px}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.danger{border-left-color:var(--danger)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

.belt-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--card2);font-size:13px;font-weight:700}
.belt-bar{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex-shrink:0}
.belt-stripes{display:flex;gap:2px;margin-left:2px}
.stripes{width:4px;height:14px;background:#fff;border-radius:2px}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.prod-img{height:150px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-img .ph{color:var(--muted);font-size:12px;text-align:center;padding:10px}
.prod-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:6px}
.prod-body h4{font-size:14px}
.prod-body .price{font-size:18px;font-weight:800;color:var(--secondary)}
.prod-body .stock{font-size:12px;color:var(--muted)}
.prod-body .btn{margin-top:auto}

.raffle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.raffle-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--border);transition:all .15s}
.raffle-cell:hover{border-color:var(--primary)}
.raffle-cell.sold{background:rgba(233,69,96,.2);color:var(--danger);border-color:rgba(233,69,96,.3);cursor:not-allowed}
.raffle-cell.mine{background:rgba(249,200,14,.2);color:var(--secondary);border-color:var(--secondary)}
.raffle-cell.winner{background:var(--ok);color:#fff;border-color:var(--ok)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:16px 0}
.tl-item::before{content:'';position:absolute;left:-23px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card2);border:3px solid var(--primary)}
.tl-item .tl-date{font-size:12px;color:var(--muted)}
.tl-item .tl-title{font-weight:700;font-size:14px;margin:2px 0}
.tl-item .tl-desc{font-size:13px;color:var(--muted)}

.notice{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--card)}
.notice.unread{border-left:3px solid var(--primary);background:var(--card2)}
.notice .n-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notice .n-title{font-weight:700;font-size:14px}
.notice .n-date{font-size:11px;color:var(--muted);margin-left:auto}
.notice .n-body{font-size:13px;color:var(--muted);line-height:1.5}

.partner-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.partner-card.sponsor{border-color:var(--secondary);box-shadow:0 0 0 1px rgba(249,200,14,.3)}
.partner-card .p-logo{width:52px;height:52px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--secondary);overflow:hidden}
.partner-card .p-logo img{width:100%;height:100%;object-fit:cover}
.partner-card h4{font-size:14px}
.partner-card .p-cat{font-size:11px;color:var(--muted);margin-top:-4px}
.sponsor-tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;color:#1a1a2e;background:var(--secondary);padding:3px 8px;border-radius:20px;letter-spacing:.5px}

.avatar-upload{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.avatar-upload .big{width:76px;height:76px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;flex-shrink:0}
.avatar-upload .big img{width:100%;height:100%;object-fit:cover}
.avatar-actions{display:flex;flex-direction:column;gap:8px}
.avatar-actions .btn{font-size:12px}

.color-input{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 12px}
.color-input input[type=color]{width:40px;height:34px;border:none;padding:0;background:none;cursor:pointer}
.color-input span{font-size:13px;color:var(--muted)}

.pix-box{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px dashed var(--secondary);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.freq-track{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.freq-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ok),var(--secondary))}

/* ===== DASHBOARD EXECUTIVO (Power BI) ===== */
.dash{display:flex;flex-direction:column;gap:18px}
.dash-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.dash-toolbar .filters{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.dash-toolbar .field{min-width:150px}
.dash-toolbar .field label{font-size:10px}
.dash-toolbar .refresh{margin-left:auto}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-c,var(--primary))}
.kpi .k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-value{font-size:28px;font-weight:800;line-height:1}
.kpi .k-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kpi .k-delta{font-weight:700;padding:2px 8px;border-radius:20px;font-size:11px}
.kpi .k-delta.up{background:rgba(46,204,113,.15);color:var(--ok)}
.kpi .k-delta.down{background:rgba(233,69,96,.15);color:var(--danger)}
.kpi .spark{position:absolute;right:14px;bottom:14px;opacity:.85}
.dash-grid{display:grid;gap:16px}
.dash-grid.cols-2{grid-template-columns:1.6fr 1fr}
.dash-grid.cols-3{grid-template-columns:1.4fr 1fr 1fr}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0}
.panel-head h3 svg{width:16px;height:16px;color:var(--primary)}
.panel-head .hint{font-size:11px;color:var(--muted)}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.chart-legend .lg{display:flex;align-items:center;gap:5px}
.chart-legend .dot{width:9px;height:9px;border-radius:3px}
.chart-tip{font-size:11px;color:var(--muted);text-align:center;padding:20px 0}
.axis-label{font-size:10px;fill:var(--muted)}
.grid-line{stroke:var(--border);stroke-width:1}
.bar-cell{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-cell .bc-label{width:130px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-cell .bc-track{flex:1;height:22px;background:var(--card2);border-radius:6px;overflow:hidden;position:relative}
.bar-cell .bc-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:700;color:#fff;min-width:34px;transition:width .5s ease}
.bar-cell .bc-val{width:40px;text-align:right;font-size:12px;font-weight:700}
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}.dash-grid.cols-2,.dash-grid.cols-3{grid-template-columns:1fr}}
@media(max-width:600px){.kpi-row{grid-template-columns:1fr}}

@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.5)}
  .main{margin-left:0}
  .hamburger{display:block}
  .content{padding:16px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .topbar{padding:12px 16px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none}
  .overlay.show{display:block}
}
@media(max-width:480px){
  .stat-card .value{font-size:22px}
  .prod-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>
    </div>
    <h1>Tatame BJJ</h1>
    <p>Sistema de Gestão para Academia de Jiu-Jitsu</p>
    <div class="field">
      <label>Usuário (CPF ou login)</label>
      <input type="text" id="loginUser" placeholder="Ex.: admin ou 12345678901" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Entrar</button>
    <div id="loginError"></div>
    <div class="login-hint">
      <b>Contas de demonstração:</b><br>
      ADM - admin / 123456<br>
      Professor Líder - lider / 123456<br>
      Professor - professor / 123456<br>
      Aluno - aluno / 123456 (João Silva)
    </div>
    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="resetarDemo()">Restaurar dados de demonstração</button>
  </div>
</div>

<!-- APP -->

/* Máscara de celular (RF-01): (XX) XXXXX-XXXX, 11 dígitos, somente celular */
function maskCelular(value){
  let d = String(value||'').replace(/\D/g,'').slice(0,11);
  if(!d) return '';
  if(d.length<=2) return '('+d;
  if(d.length<=7) return '('+d.slice(0,2)+') '+d.slice(2);
  return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}
function celularValido(value){
  const d = String(value||'').replace(/\D/g,'');
  return d.length===11 && d[2]==='9';
}
function maskCPF(value){
  let d = String(value||'').replace(/\D/g,'').slice(0,11);
  if(d.length<=3) return d;
  if(d.length<=6) return d.slice(0,3)+'.'+d.slice(3);
  if(d.length<=9) return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6);
  return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9);
}
function validarCPF(cpf){
  let c = String(cpf||'').replace(/\D/g,'');
  if(c.length!==11) return false;
  if(/^(\d)\1{10}$/.test(c)) return false;
  let soma=0, i;
  for(i=0;i<9;i++) soma+=parseInt(c[i])*(10-i);
  let r1=(soma*10)%11; if(r1===10) r1=0; if(r1!==parseInt(c[9])) return false;
  soma=0; for(i=0;i<10;i++) soma+=parseInt(c[i])*(11-i);
  let r2=(soma*10)%11; if(r2===10) r2=0; if(r2!==parseInt(c[10])) return false;
  return true;
}

const FAIXAS_IBJJF = {
  'Branca': {hex:'#e8e8e8', min:4},
  'Cinza': {hex:'#9e9e9e', min:4},
  'Amarela': {hex:'#f1c40f', min:7},
  'Laranja': {hex:'#e67e22', min:10},
  'Verde': {hex:'#27ae60', min:13},
  'Azul': {hex:'#2e86de', min:16},
  'Roxa': {hex:'#8e44ad', min:16},
  'Marrom': {hex:'#6d4c41', min:18},
  'Preta': {hex:'#111111', min:19}
};
const FAIXAS_INFANTIS = ['Branca','Cinza','Amarela','Laranja','Verde'];
const FAIXAS_ADULTAS = ['Azul','Roxa','Marrom','Preta'];
const FAIXA_ORDEM = ['Branca','Cinza','Amarela','Laranja','Verde','Azul','Roxa','Marrom','Preta'];
function idadeDe(nascimento){
  if(!nascimento) return null;
  const n = new Date(nascimento + 'T00:00:00');
  const hoje = new Date();
  let idade = hoje.getFullYear() - n.getFullYear();
  const m = hoje.getMonth() - n.getMonth();
  if(m<0 || (m===0 && hoje.getDate()<n.getDate())) idade--;
  return idade;
}
function faixaInfo(aluno){
  const f = FAIXAS_IBJJF[aluno.faixa] || {hex:'#e8e8e8'};
  return {faixa:aluno.faixa, hex:f.hex, graus:Number(aluno.graus||0)};
}

function currentAlunoId(){
  const s = Session.get();
  if(s.perfil!=='Aluno') return null;
  if(current.depId) return current.depId;
  return s.alunoId;
}
function alunoAtual(){
  const id = currentAlunoId();
  return (DB.get('alunos')||[]).find(a=>a.id===id) || null;
}
function renderDepSwitch(){
  const s = Session.get();
  const el = document.getElementById('depSwitch');
  if(!s || s.perfil!=='Aluno'){ el.innerHTML=''; return; }
  const al = (DB.get('alunos')||[]).find(a=>a.id===s.alunoId);
  if(!al || !al.dependentes || !al.dependentes.length){ el.innerHTML=''; return; }
  const deps = (DB.get('alunos')||[]).filter(a=>al.dependentes.includes(a.id));
  const cur = currentAlunoId();
  let html = '<select style="width:auto;min-width:150px" onchange="setDep(this.value)">';
  html += '<option value="'+s.alunoId+'"'+(cur===s.alunoId?' selected':'')+'>Para mim</option>';
  deps.forEach(d=>{ html += '<option value="'+d.id+'"'+(cur===d.id?' selected':'')+'>Para '+esc(d.nome.split(' ')[0])+'</option>'; });
  html += '</select>';
  el.innerHTML = html;
}
function setDep(id){
  const s = Session.get();
  current.depId = (id===s.alunoId)?null:id;
  renderDepSwitch(); renderNav();
  go(current.view);
}

function doLogin(){
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.innerHTML='';
  let users = DB.get('users')||[];
  if(!users.length || !users.some(x=>['admin','professor','aluno','lider'].includes((x.login||'').toLowerCase()))){
    DB.reset();
    users = DB.get('users')||[];
  }
  if(!users.length){
    err.innerHTML = '<div class="alert alert-danger" style="margin-top:12px">'+icon('warn')+'<div>Não foi possível acessar o armazenamento local do navegador. Habilite cookies/armazenamento e recarregue a página.</div></div>';
    return;
  }
  let user = users.find(x=>x.login && x.login.toLowerCase()===u);
  if(!user){
    const al = (DB.get('alunos')||[]).find(a=>a.cpf && a.cpf.replace(/\D/g,'')===u.replace(/\D/g,''));
    if(al) user = users.find(x=>x.alunoId===al.id);
  }
  if(!user || user.senha!==p){
    err.innerHTML = '<div class="alert alert-danger" style="margin-top:12px">'+icon('warn')+'<div>Usuário ou senha inválidos.</div></div>';
    return;
  }
  Session.set(user);
  current.depId = null;
  document.getElementById('loginView').style.display='none';
  document.getElementById('appView').style.display='flex';
  applyWhiteLabel();
  renderNav();
  go('dashboard');
}
function doLogout(){
  Session.clear();
  document.getElementById('appView').style.display='none';
  document.getElementById('loginView').style.display='flex';
  document.getElementById('loginPass').value='';
}

  if(!confirm('Restaurar os dados de demonstração? Isso apaga todas as alterações locais.')) return;
  DB.reset();

}

function toast(msg, tipo){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast '+(tipo||'');
  t.innerHTML = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}
function openModal(html){
  const b = document.createElement('div');
  b.className='modal-backdrop';
  b.id='modalBackdrop';
  b.innerHTML = '<div class="modal">'+html+'</div>';
  b.addEventListener('click', e=>{ if(e.target===b) closeModal(); });
  document.body.appendChild(b);
}

const dashFilter = { periodo:'30d', faixa:'todas', status:'todos' };

function renderDashboard(){
  const s = Session.get();
  if(s.perfil==='Aluno') return renderDashboardAluno();
  if(s.perfil==='Professor') return renderDashboardProfessor();
  setTitle('Dashboard Executivo','Análise gerencial em tempo real');

  const alunos = DB.get('alunos')||[];
  const turmas = DB.get('turmas')||[];
  const mensalidades = DB.get('mensalidades')||[];
  const presencas = DB.get('presencas')||[];
  const pedidos = DB.get('pedidos')||[];
  const bilhetes = DB.get('bilhetes')||[];
  const rifas = DB.get('rifas')||[];

  const hoje = new Date();
  const dias = dashFilter.periodo==='7d'?7 : dashFilter.periodo==='90d'?90 : 30;
  const corte = new Date(hoje.getTime()-dias*86400000).toISOString().slice(0,10);

  let alunosF = alunos;
  if(dashFilter.faixa!=='todas') alunosF = alunosF.filter(a=>a.faixa===dashFilter.faixa);
  if(dashFilter.status!=='todos') alunosF = alunosF.filter(a=>a.ativo===(dashFilter.status==='ativo'));

  const idsF = new Set(alunosF.map(a=>a.id));
  const mensalidadesF = mensalidades.filter(m=>idsF.has(m.alunoId));
  const pedidosF = pedidos.filter(p=>idsF.has(p.alunoId));
  const presencasF = presencas.filter(p=>idsF.has(p.alunoId));

  const ativos = alunosF.filter(a=>a.ativo).length;
  const receitaMes = mensalidadesF.filter(m=>m.mes===hojeISO().slice(0,7)&&m.status==='pago').reduce((x,m)=>x+m.valor,0);
  const vendas = pedidosF.reduce((x,p)=>x+p.total,0);
  const receitaRifas = bilhetes.filter(b=>b.pago&&idsF.has(b.alunoId)).reduce((x,b)=>{const r=rifas.find(q=>q.id===b.rifaId);return x+(r?r.preco:0);},0);
  const emAberto = mensalidadesF.filter(m=>m.status==='aberto').reduce((x,m)=>x+m.valor,0);
  const presentes = presencasF.filter(p=>p.presente).length;
  const taxa = presencasF.length? Math.round(presentes/presencasF.length*100) : 0;

  let html = '<div class="dash">';

  html += '<div class="dash-toolbar">'
    +'<div class="filters">'
    +'<div class="field"><label>Período</label><select id="dfPeriodo" onchange="dashFilter.periodo=this.value;renderDashboard()">'
    +'<option value="7d"'+(dashFilter.periodo==='7d'?' selected':'')+'>Últimos 7 dias</option>'
    +'<option value="30d"'+(dashFilter.periodo==='30d'?' selected':'')+'>Últimos 30 dias</option>'
    +'<option value="90d"'+(dashFilter.periodo==='90d'?' selected':'')+'>Últimos 90 dias</option>'
    +'</select></div>'
    +'<div class="field"><label>Faixa</label><select id="dfFaixa" onchange="dashFilter.faixa=this.value;renderDashboard()">'
    +'<option value="todas"'+(dashFilter.faixa==='todas'?' selected':'')+'>Todas</option>'
    +Object.keys(FAIXAS_IBJJF).map(f=>'<option value="'+f+'"'+(dashFilter.faixa===f?' selected':'')+'>'+f+'</option>').join('')
    +'</select></div>'
    +'<div class="field"><label>Status</label><select id="dfStatus" onchange="dashFilter.status=this.value;renderDashboard()">'
    +'<option value="todos"'+(dashFilter.status==='todos'?' selected':'')+'>Todos</option>'
    +'<option value="ativo"'+(dashFilter.status==='ativo'?' selected':'')+'>Ativos</option>'
    +'<option value="inativo"'+(dashFilter.status==='inativo'?' selected':'')+'>Inativos</option>'
    +'</select></div>'
    +'</div>'
    +'<button class="btn btn-ghost btn-sm refresh" onclick="renderDashboard()">'+icon('refresh',14)+' Atualizar</button>'
    +'</div>';

  html += '<div class="kpi-row">';
  html += kpiCard('Alunos Ativos', ativos, 'alunos', '#3498db', '+'+Math.max(0,ativos-4)+' no período', [3,4,5,ativos]);
  html += kpiCard('Receita no Mês', money(receitaMes+vendas+receitaRifas), 'financeiro', '#2ecc71', 'Mensalidades + Loja + Rifas', [2,3,4,receitaMes+vendas+receitaRifas]);
  html += kpiCard('Em Aberto', money(emAberto), 'warn', '#f39c12', mensalidadesF.filter(m=>m.status==='aberto').length+' mensalidade(s)', [4,3,2,emAberto]);
  html += kpiCard('Taxa de Presença', taxa+'%', 'check', '#9b59b6', presentes+' de '+presencasF.length+' registros', [0,50,70,taxa]);
  html += '</div>';

  html += '<div class="dash-grid cols-2">';
  html += '<div class="panel"><div class="panel-head"><h3>'+icon('financeiro')+'Receita no Período</h3><span class="hint">Mensalidades pagas + vendas</span></div>'
    + receitaLineChart(mensalidadesF, pedidosF, corte) +'</div>';
  html += '<div class="panel"><div class="panel-head"><h3>'+icon('trilha')+'Alunos por Faixa</h3><span class="hint">Distribuição atual</span></div>'
    + donutFaixas(alunosF) +'</div>';
  html += '</div>';

  html += '<div class="dash-grid cols-2">';
  html += '<div class="panel"><div class="panel-head"><h3>'+icon('presencas')+'Presenças por Turma</h3><span class="hint">No período selecionado</span></div>'

  html += '<div class="panel"><div class="panel-head"><h3>'+icon('financeiro')+'Receita Consolidada</h3></div>'
    + receitaTable(mensalidadesF, pedidosF, bilhetes, rifas, alunosF) +'</div>';
  html += '</div>';

  html += '<div class="dash-grid cols-2">';
  html += '<div class="panel"><div class="panel-head"><h3>'+icon('presencas')+'Presença ao Longo do Tempo</h3><span class="hint">Presentes por dia</span></div>'
    + presencaLineChart(presencasF, corte) +'</div>';
  html += '<div class="panel"><div class="panel-head"><h3>'+icon('award')+'Ranking de Alunos</h3><span class="hint">Presença + mensalidades em dia</span></div>'
    + rankingAlunos(alunosF, presencasF, mensalidadesF) +'</div>';
  html += '</div>';

  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

/* ---------- DASHBOARD DO PROFESSOR (operacional, sem financeiro) ---------- */
function renderDashboardProfessor(){
  setTitle('Dashboard do Professor','Visão operacional');
  const alunos = DB.get('alunos')||[];
  const turmas = DB.get('turmas')||[];
  const hoje = new Date().getDay();
  const turmasHoje = turmas.filter(t=>t.dia===hoje);
  const presencas = DB.get('presencas')||[];
  const presHoje = presencas.filter(p=>p.data===hojeISO()&&p.presente).length;
  const mensalidades = DB.get('mensalidades')||[];
  const inad = alunos.filter(a=>mensalidades.some(m=>m.alunoId===a.id&&m.status==='aberto')).length;
  let html = '<div class="grid grid-4">';
  html += statCard('Alunos Ativos', alunos.filter(a=>a.ativo).length, 'alunos', '#3498db');
  html += statCard('Turmas Hoje', turmasHoje.length, 'turmas', '#9b59b6');
  html += statCard('Presenças Hoje', presHoje, 'presencas', '#2ecc71');
  html += statCard('Inadimplentes', inad, 'warn', '#f39c12');
  html += '</div>';
  html += '<div class="grid grid-2">';
  html += '<div class="card"><h3>'+icon('turmas')+'Turmas de Hoje ('+DIA_NOME[hoje]+')</h3>';
  if(!turmasHoje.length){ html += '<p style="color:var(--muted);font-size:13px">Nenhuma turma hoje.</p>'; }
  else{
    html += '<div class="table-wrap"><table><thead><tr><th>Turma</th><th>Professor</th><th>Horário</th><th>Vagas</th></tr></thead><tbody>';
    turmasHoje.forEach(t=>{
      const prof = (DB.get('professores')||[]).find(p=>p.id===t.professor);
      const ags = (DB.get('agendamentos')||[]).filter(a=>a.turmaId===t.id && a.data===hojeISO());
      html += '<tr><td><b>'+esc(t.nome)+'</b></td><td>'+esc(prof?prof.nome:'-')+'</td><td>'+esc(t.hora)+'</td><td>'+ags.length+'/'+t.vagas+'</td></tr>';
    });

  }
  html += '</div>';
  html += '<div class="card"><h3>'+icon('alunos')+'Situação dos Alunos</h3><div class="table-wrap"><table><thead><tr><th>Aluno</th><th>Faixa</th><th>Status</th><th>Adimplência</th></tr></thead><tbody>';
  alunos.slice(0,8).forEach(a=>{
    const f = faixaInfo(a);

  });
  html += '</tbody></table></div></div>';
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

/* ---------- KPI CARD ---------- */
function kpiCard(label, value, ic, color, foot, spark){
  return '<div class="kpi" style="--kpi-c:'+color+'">'
    +'<div class="k-label">'+icon(ic,14)+esc(label)+'</div>'
    +'<div class="k-value">'+value+'</div>'
    +'<div class="k-foot">'+esc(foot||'')+'</div>'
    +'<svg class="spark" width="80" height="30" viewBox="0 0 80 30">'+sparkSvg(spark,color)+'</svg>'
    +'</div>';
}
function sparkSvg(arr, color){
  if(!arr||arr.length<2) return '';
  const w=80,h=30,pad=3;
  const min=Math.min(...arr),max=Math.max(...arr);
  const rng=(max-min)||1;
  const pts=arr.map((v,i)=>[(pad+(w-2*pad)*i/(arr.length-1)).toFixed(1), (h-pad-(h-2*pad)*(v-min)/rng).toFixed(1)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=pts[0][0]+','+h+' '+line+' '+pts[pts.length-1][0]+','+h;
  return '<polygon points="'+area+'" fill="'+color+'" opacity="0.12"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
}

/* ---------- GRÁFICO DE LINHA (receita) ---------- */
function receitaLineChart(mensalidades, pedidos, corte){
  const meses = [];
  const d = new Date(corte+'T00:00:00');
  for(let i=0;i<6;i++){
    const m = new Date(d.getFullYear(), d.getMonth()+i, 1);
    meses.push({chave:m.toISOString().slice(0,7), rot:m.toLocaleDateString('pt-BR',{month:'short'})});
  }
  const valores = meses.map(m=>{
    const ms = mensalidades.filter(x=>x.mes===m.chave&&x.status==='pago').reduce((s,x)=>s+x.valor,0);
    const pd = pedidos.filter(p=>p.data.startsWith(m.chave)).reduce((s,p)=>s+p.total,0);
    return ms+pd;
  });
  const max = Math.max(...valores,1);
  const w=560,h=200,padL=46,padB=26,padT=14,padR=12;
  const iw=w-padL-padR, ih=h-padT-padB;
  let grid='';
  for(let i=0;i<=4;i++){
    const y=padT+ih*i/4;
    const val=Math.round(max*(4-i)/4);
    grid+='<line class="grid-line" x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'"/>'
      +'<text class="axis-label" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+money(val).replace(',00','')+'</text>';
  }
  const pts=valores.map((v,i)=>[(padL+iw*i/(valores.length-1)).toFixed(1),(padT+ih*(1-v/max)).toFixed(1)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=padL+','+(padT+ih)+' '+line+' '+pts[pts.length-1][0]+','+(padT+ih);
  let xl='';
  meses.forEach((m,i)=>{ xl+='<text class="axis-label" x="'+(padL+iw*i/(valores.length-1))+'" y="'+(h-8)+'" text-anchor="middle">'+m.rot+'</text>'; });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-height:220px">'+grid
    +'<polygon points="'+area+'" fill="var(--primary)" opacity="0.12"/>'
    +'<polyline points="'+line+'" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+((i===pts.length-1)?4:3)+'" fill="var(--primary)" stroke="#fff" stroke-width="1.5"/>').join('')
    +xl+'</svg>';
}

/* ---------- DONUT (alunos por faixa) ---------- */
function donutFaixas(alunos){
  const cont={};
  alunos.forEach(a=>{ cont[a.faixa]=(cont[a.faixa]||0)+1; });
  const keys=Object.keys(cont);
  if(!keys.length) return '<div class="chart-tip">Sem alunos para exibir.</div>';
  const total=alunos.length;
  const r=70,cx=50,cy=50,circ=2*Math.PI*r;
  let off=0, segs='', legend='';
  const cores=['#e94560','#f9c80e','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c','#c0392b','#7f8c8d'];
  keys.forEach((k,i)=>{
    const frac=cont[k]/total;
    const len=frac*circ;
    const color=FAIXAS_IBJJF[k]?FAIXAS_IBJJF[k].hex:cores[i%cores.length];
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="26" stroke-dasharray="'+len.toFixed(1)+' '+(circ-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;
    legend+='<span class="lg"><span class="dot" style="background:'+color+'"></span>'+k+' ('+cont[k]+')</span>';
  });
  return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">'
    +'<svg viewBox="0 0 100 100" width="150" height="150" style="flex-shrink:0">'+segs
    +'<text x="50" y="48" text-anchor="middle" font-size="16" font-weight="800" fill="var(--text)">'+total+'</text>'
    +'<text x="50" y="62" text-anchor="middle" font-size="8" fill="var(--muted)">ALUNOS</text></svg>'
    +'<div class="chart-legend" style="flex-direction:column;gap:8px">'+legend+'</div></div>';
}

/* ---------- BARRAS (presença por turma) ---------- */
function presencaBars(turmas, presencas){
  if(!turmas.length) return '<div class="chart-tip">Nenhuma turma.</div>';
  let html='';
  turmas.forEach(t=>{
    const regs=presencas.filter(p=>p.turmaId===t.id);
    const pres=regs.filter(p=>p.presente).length;
    const pct=regs.length?Math.round(pres/regs.length*100):0;
    html+='<div class="bar-cell"><div class="bc-label">'+esc(t.nome)+'</div>'
      +'<div class="bc-track"><div class="bc-fill" style="width:'+pct+'%">'+pct+'%</div></div>'
      +'<div class="bc-val">'+pres+'/'+regs.length+'</div></div>';
  });
  return html;
}

/* ---------- TABELA DE RECEITA CONSOLIDADA ---------- */
function receitaTable(mensalidades, pedidos, bilhetes, rifas, alunos){
  const linhas=[];
  mensalidades.forEach(m=>{
    const a=alunos.find(x=>x.id===m.alunoId);
    linhas.push({origem:'Mensalidade', ref:m.mes, aluno:a?a.nome:'-', valor:m.valor, status:m.status});
  });
  pedidos.forEach(p=>{
    const a=alunos.find(x=>x.id===p.alunoId);
    linhas.push({origem:'Loja', ref:fmtData(p.data), aluno:a?a.nome:'-', valor:p.total, status:p.status});
  });
  bilhetes.filter(b=>b.pago).forEach(b=>{
    const r=rifas.find(x=>x.id===b.rifaId);
    const a=alunos.find(x=>x.id===b.alunoId);
    if(r) linhas.push({origem:'Rifa', ref:r.titulo, aluno:a?a.nome:'-', valor:r.preco, status:'pago'});
  });
  linhas.sort((a,b)=>String(b.ref).localeCompare(String(a.ref)));
  const top=linhas.slice(0,8);
  let html='<div class="table-wrap"><table><thead><tr><th>Origem</th><th>Ref.</th><th>Aluno</th><th>Valor</th><th>Status</th></tr></thead><tbody>';
  if(!top.length) html+='<tr><td colspan="5" style="text-align:center;color:var(--muted)">Sem lançamentos no período.</td></tr>';
  top.forEach(l=>{
    const st= l.status==='pago'||l.status==='entregue'||l.status==='enviado' ? 'tag-ok' : (l.status==='aberto'?'tag-danger':'tag-blue');
    html+='<tr><td>'+esc(l.origem)+'</td><td style="font-size:12px">'+esc(l.ref)+'</td><td>'+esc(l.aluno)+'</td><td>'+money(l.valor)+'</td><td><span class="tag '+st+'">'+esc(l.status)+'</span></td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

/* ---------- LINHA DE PRESENÇA AO LONGO DO TEMPO ---------- */
function presencaLineChart(presencas, corte){
  const dias = [];
  const d = new Date(corte+'T00:00:00');
  const fim = new Date();
  for(let dt=new Date(d); dt<=fim; dt.setDate(dt.getDate()+1)){
    const chave = dt.toISOString().slice(0,10);
    const regs = presencas.filter(p=>p.data===chave);
    const pres = regs.filter(p=>p.presente).length;
    dias.push({chave, rot: dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), pres, total:regs.length});
  }
  const totalRegs = dias.reduce((s,x)=>s+x.total,0);
  if(!totalRegs) return '<div class="chart-tip">Sem presenças no período.</div>';

  const valores = dias.map(x=>x.pres);
  const max = Math.max(...valores, 1);
  const w=560,h=200,padL=40,padB=26,padT=14,padR=12;
  const iw=w-padL-padR, ih=h-padT-padB;

  let grid='';
  for(let i=0;i<=4;i++){
    const y=padT+ih*i/4;
    const val=Math.round(max*(4-i)/4);
    grid+='<line class="grid-line" x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'"/>'
      +'<text class="axis-label" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+val+'</text>';
  }

  const passo = Math.max(1, Math.floor(dias.length/8));
  const pts = dias.map((x,i)=>[(padL+iw*i/(dias.length-1)).toFixed(1),(padT+ih*(1-x.pres/max)).toFixed(1)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = padL+','+(padT+ih)+' '+line+' '+pts[pts.length-1][0]+','+(padT+ih);

  let xl='';
  dias.forEach((x,i)=>{
    if(i%passo===0 || i===dias.length-1){
      xl+='<text class="axis-label" x="'+(padL+iw*i/(dias.length-1))+'" y="'+(h-8)+'" text-anchor="middle">'+x.rot+'</text>';
    }
  });

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-height:220px">'+grid
    +'<polygon points="'+area+'" fill="var(--secondary)" opacity="0.12"/>'
    +'<polyline points="'+line+'" fill="none" stroke="var(--secondary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===pts.length-1?4:2.5)+'" fill="var(--secondary)" stroke="#fff" stroke-width="1.5"/>').join('')
    +xl+'</svg>';
}

/* ---------- RANKING DE ALUNOS ---------- */
function rankingAlunos(alunos, presencas, mensalidades){
  const linhas = alunos.map(a=>{
    const regs = presencas.filter(p=>p.alunoId===a.id);
    const pres = regs.filter(p=>p.presente).length;
    const taxa = regs.length ? Math.round(pres/regs.length*100) : 0;
    const emDias = mensalidades.filter(m=>m.alunoId===a.id && m.status==='pago').length;
    const score = Math.round(taxa*0.6 + Math.min(emDias*5,40));
    return {a, regs:regs.length, pres, taxa, emDias, score};
  }).filter(x=>x.regs>0 || aAtivo(x.a))
    .sort((x,y)=>y.score-x.score)
    .slice(0,6);

  if(!linhas.length) return '<div class="chart-tip">Sem dados de presença para rankear.</div>';

  let html='';
  const medalhas=['#f9c80e','#c0c0c0','#cd7f32'];
  linhas.forEach((l,i)=>{
    const f = faixaInfo(l.a);
    html+='<div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(42,53,86,.4)">'
      +'<div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;background:'+(medalhas[i]||'var(--card2)')+'">'+(i+1)+'</div>'
      +avHtml(l.a.foto,l.a.nome)
      +'<div style="flex:1;min-width:0"><b style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(l.a.nome)+'</b>'
      +'<div style="font-size:11px;color:var(--muted)">'+l.pres+'/'+l.regs+' presenças • '+l.taxa+'%</div></div>'
      +'<span class="belt-chip" style="font-size:11px;padding:3px 8px"><span class="belt-bar" style="width:10px;height:10px;background:'+f.hex+'"></span>'+esc(l.a.faixa)+'</span>'
      +'<div style="font-size:12px;font-weight:700;color:var(--secondary);width:34px;text-align:right">'+l.score+'</div>'
      +'</div>';
  });
  return html;
}
function aAtivo(a){ return a && a.ativo; }

function agendarTurma(turmaId){
  const al = alunoAtual();
  const ags = DB.get('agendamentos')||[];
  const hoje = hojeISO();
  const turma = (DB.get('turmas')||[]).find(t=>t.id===turmaId);
  const agsTurma = ags.filter(a=>a.turmaId===turmaId && a.data===hoje);
  if(agsTurma.length>=turma.vagas){ toast('Turma lotada.','warn'); return; }
  if(ags.some(a=>a.alunoId===al.id && a.turmaId===turmaId && a.data===hoje)){ toast('Você já está agendado.','warn'); return; }
  ags.push({id:uid(), alunoId:al.id, turmaId, data:hoje, status:'confirmado'});
  DB.set('agendamentos', ags);
  toast('Agendamento confirmado!','ok');
  renderDashboardAluno();
}
function cancelarAgendamento(agId){
  let ags = DB.get('agendamentos')||[];
  ags = ags.filter(a=>a.id!==agId);
  DB.set('agendamentos', ags);
  toast('Agendamento cancelado.');
  renderDashboardAluno();
}

    html += '<td><span class="tag '+(a.ativo?'tag-ok':'tag-danger')+'">'+(a.ativo?'Ativo':'Inativo')+'</span></td>';
    html += '<td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="modalAluno(\''+a.id+'\')">'+icon('edit',14)+'</button>';

  });
  if(!filtrados.length) html += '<tr><td colspan="9" style="text-align:center;color:var(--muted)">Nenhum aluno encontrado.</td></tr>';
  html += '</tbody></table></div></div>';

}
function exportarAlunosCompletoCSV(){
  const alunos = DB.get('alunos')||[];
  const mensalidades = DB.get('mensalidades')||[];
  let csv = 'Nome;CPF;Email;Celular;Nascimento;Idade;Faixa;Graus;Status;ValorMensalidade;Adimplencia;Dependentes\n';
  alunos.forEach(a=>{
    const ms = mensalidades.filter(m=>m.alunoId===a.id).sort((x,y)=>y.mes.localeCompare(x.mes));
    const ult = ms[0];
    const inad = ms.some(m=>m.status==='aberto');
    csv += a.nome+';'+(a.cpf||'')+';'+(a.email||'')+';'+(a.celular||'')+';'+(a.nascimento||'')+';'+(idadeDe(a.nascimento)!=null?idadeDe(a.nascimento):'')+';'+a.faixa+';'+a.graus+';'+(a.ativo?'Ativo':'Inativo')+';'+(ult?ult.valor:'')+';'+(inad?'Inadimplente':(ms.length?'Adimplente':'Sem mensalidade'))+';'+((a.dependentes||[]).length)+'\n';
  });
  downloadCSV(csv, 'lista_alunos_'+hojeISO()+'.csv');
  toast('Lista de alunos exportada.','ok');
}

function uploadFoto(inputId, prevId){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = ()=>{
    const file = inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      document.getElementById(inputId).value = e.target.result;
      const prev = document.getElementById(prevId);
      prev.innerHTML = '<img src="'+e.target.result+'" alt="">';
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
function salvarAluno(id){
  const alunos = DB.get('alunos')||[];
  const users = DB.get('users')||[];
  const nome = document.getElementById('alNome').value.trim();
  const cpf = (document.getElementById('alCpf').value||'').replace(/\D/g,'');
  const celular = document.getElementById('alCel').value;
  const email = document.getElementById('alEmail').value.trim();
  const nascimento = document.getElementById('alNasc').value;
  const faixa = document.getElementById('alFaixa').value;
  const graus = Number(document.getElementById('alGraus').value);
  const ativo = document.getElementById('alAtivo').value==='1';
  const nota = document.getElementById('alNota').value.trim();
  const foto = document.getElementById('alFoto').value;

  if(!nome){ toast('Informe o nome.','warn'); return; }
  if(!id && !validarCPF(cpf)){ toast('CPF inválido.','warn'); return; }
  if(celular && !celularValido(celular)){ toast('Celular inválido. Use (XX) XXXXX-XXXX, somente celular.','warn'); return; }
  if(!id && alunos.some(a=>a.cpf && a.cpf.replace(/\D/g,'')===cpf)){
    toast('CPF já cadastrado no sistema.','danger'); return;
  }
  if(id){
    const a = alunos.find(x=>x.id===id);
    Object.assign(a, {nome, celular, email, nascimento, faixa, graus, ativo, nota, foto});
    DB.set('alunos', alunos);
    const u = users.find(x=>x.alunoId===id);
    if(u){ u.nome=nome; u.email=email; u.foto=foto; DB.set('users', users); }
    toast('Aluno atualizado.','ok');
  } else {
    if(users.some(x=>x.login===cpf)){
      toast('Já existe usuário com este CPF.','danger'); return;
    }
    const novo = {id:uid(), nome, cpf, email, celular, nascimento, faixa, graus, ativo, foto, dependentes:[], dependenteDe:'', nota};
    alunos.push(novo);
    DB.set('alunos', alunos);
    users.push({id:uid(), login:cpf, nome, senha:'123456', perfil:'Aluno', cpf, email, foto, alunoId:novo.id});
    DB.set('users', users);
    toast('Aluno cadastrado. Usuário criado: login='+cpf+' / senha=123456','ok');
  }
  closeModal();
  renderAlunos();
}

  DB.set('alunos', (DB.get('alunos')||[]).filter(a=>a.id!==id));

    html += '<tr><td><div style="display:flex;align-items:center;gap:10px">'+avHtml(a.foto,a.nome)+'<b>'+esc(a.nome)+'</b></div></td><td><span class="belt-chip"><span class="belt-bar" style="background:'+f.hex+'"></span>'+esc(a.faixa)+'</span></td><td><button class="btn '+(presente?'btn-ok':'btn-ghost')+' btn-sm" onclick="togglePresenca(\''+a.id+'\',\''+tid+'\')">'+icon('check',14)+' '+(presente?'Presente':'Marcar')+'</button></td></tr>';

function togglePresenca(alunoId, turmaId){
  const presencas = DB.get('presencas')||[];
  const hoje = hojeISO();
  const idx = presencas.findIndex(p=>p.alunoId===alunoId && p.turmaId===turmaId && p.data===hoje);
  if(idx>=0){ presencas[idx].presente = !presencas[idx].presente; }
  else { presencas.push({id:uid(), alunoId, turmaId, data:hoje, presente:true}); }
  DB.set('presencas', presencas);
  renderChamada();
}
function renderFrequenciaBody(){
  const body = document.getElementById('presBody');
  const turmas = DB.get('turmas')||[];
  const presencas = DB.get('presencas')||[];
  const alunos = DB.get('alunos')||[];
  const dias = freqPeriodo==='7d'?7 : freqPeriodo==='90d'?90 : (freqPeriodo==='todos'?9999:30);
  const corte = freqPeriodo==='todos' ? '0000-01-01' : new Date(Date.now()-dias*86400000).toISOString().slice(0,10);
  let html = '<div class="toolbar-row">'
  +'<div class="field"><label>Período</label><select id="freqPeriodo" onchange="freqPeriodo=this.value;renderFrequenciaBody()">'
  +'<option value="7d"'+(freqPeriodo==='7d'?' selected':'')+'>Últimos 7 dias</option>'
  +'<option value="30d"'+(freqPeriodo==='30d'?' selected':'')+'>Últimos 30 dias</option>'
  +'<option value="90d"'+(freqPeriodo==='90d'?' selected':'')+'>Últimos 90 dias</option>'
  +'<option value="todos"'+(freqPeriodo==='todos'?' selected':'')+'>Todo o histórico</option>'
  +'</select></div>'
  +'<div class="field"><label>Turma</label><select id="freqTurma" onchange="freqTurma=this.value;renderFrequenciaBody()"><option value="todas"'+(freqTurma==='todas'?' selected':'')+'>Todas</option>'+turmas.map(t=>'<option value="'+t.id+'"'+(freqTurma===t.id?' selected':'')+'>'+esc(t.nome)+'</option>').join('')+'</select></div>'
  +'</div>';
  const regs = presencas.filter(p=>p.data>=corte && (freqTurma==='todas'||p.turmaId===freqTurma));
  const linhas = alunos.filter(a=>a.ativo).map(a=>{
    const r = regs.filter(p=>p.alunoId===a.id);
    const pres = r.filter(p=>p.presente).length;
    const faltas = r.length-pres;
    const taxa = r.length?Math.round(pres/r.length*100):0;
    return {a, pres, faltas, total:r.length, taxa};
  }).filter(x=>x.total>0).sort((x,y)=>y.taxa-x.taxa||y.pres-x.pres);
  html += '<div class="card"><div class="table-wrap"><table><thead><tr><th>Aluno</th><th>Faixa</th><th>Presenças</th><th>Faltas</th><th>Total</th><th>Taxa</th></tr></thead><tbody>';
  if(!linhas.length) html += '<tr><td colspan="6" style="text-align:center;color:var(--muted)">Nenhuma frequência registrada no período.</td></tr>';
  linhas.forEach(l=>{

function exportarPresencas(turmaId){
  const alunos = DB.get('alunos')||[];
  const presencas = DB.get('presencas')||[];
  const hoje = hojeISO();
  const turma = (DB.get('turmas')||[]).find(t=>t.id===turmaId);
  let csv = 'Aluno;CPF;Faixa;Presente\n';
  alunos.filter(a=>a.ativo).forEach(a=>{
    const pr = presencas.find(p=>p.alunoId===a.id && p.turmaId===turmaId && p.data===hoje);
    csv += a.nome+';'+(a.cpf||'')+';'+a.faixa+';'+(pr&&pr.presente?'Sim':'Não')+'\n';
  });
  downloadCSV(csv, 'presencas_'+turma.nome.replace(/\s+/g,'_')+'_'+hoje+'.csv');
}
function downloadCSV(csv, nome){
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
  URL.revokeObjectURL(a.href);
}

function copiarPix(){
  const chave = (DB.get('config')||{}).pixKey||'';
  if(!chave){ toast('Chave Pix não cadastrada.','warn'); return; }
  const ok = ()=>toast('Chave Pix copiada!','ok');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(chave).then(ok).catch(()=>{ fallbackCopy(chave); ok(); }); }
  else { fallbackCopy(chave); ok(); }
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

function proximaFaixa(faixa, idade){
  if(FAIXAS_INFANTIS.includes(faixa)){
    const i = FAIXAS_INFANTIS.indexOf(faixa);
    if(i<FAIXAS_INFANTIS.length-1) return FAIXAS_INFANTIS[i+1];
    return idade!=null && idade>=16 ? 'Azul' : null;
  }
  const i = FAIXAS_ADULTAS.indexOf(faixa);
  if(i<FAIXAS_ADULTAS.length-1) return FAIXAS_ADULTAS[i+1];
  return null;
}
function modalGraduar(alunoId){
  const a = (DB.get('alunos')||[]).find(x=>x.id===alunoId);
  const idade = idadeDe(a.nascimento);
  const prox = proximaFaixa(a.faixa, idade);
  let aviso = '';
  if(prox && idade!=null && idade < FAIXAS_IBJJF[prox].min){
    aviso = '<div class="alert alert-warn">'+icon('warn')+'<div>Idade mínima para a faixa <b>'+prox+'</b> é '+FAIXAS_IBJJF[prox].min+' anos. O aluno tem '+idade+' anos. A graduação não será bloqueada, mas pode confirmar mesmo assim.</div></div>';
  }
  openModal('<h3>Graduar - '+esc(a.nome)+'<button class="modal-close" onclick="closeModal()">'+icon('sair')+'</button></h3>'
  +aviso
  +'<div class="form-grid">'
  +'<div class="field"><label>Faixa atual</label><input value="'+esc(a.faixa)+'" readonly></div>'
  +'<div class="field"><label>Nova faixa</label><select id="grFaixa">'+Object.keys(FAIXAS_IBJJF).map(f=>'<option value="'+f+'"'+(prox===f?' selected':'')+'>'+f+'</option>').join('')+'</select></div>'
  +'<div class="field"><label>Tipo</label><select id="grTipo"><option value="faixa">Promoção de faixa</option><option value="grau">Grau</option></select></div>'
  +'<div class="field"><label>Observação</label><input id="grObs" placeholder="Examinho, tempo de treino..."></div>'
  +'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarGraduacao(\''+alunoId+'\')">Confirmar Graduação</button></div>');
}
function salvarGraduacao(alunoId){
  const alunos = DB.get('alunos')||[];
  const trilha = DB.get('trilha')||[];
  const a = alunos.find(x=>x.id===alunoId);
  const nova = document.getElementById('grFaixa').value;
  const tipo = document.getElementById('grTipo').value;
  const obs = document.getElementById('grObs').value.trim();
  const antiga = a.faixa;
  if(tipo==='faixa'){
    if(nova===antiga){ toast('Selecione uma faixa diferente.','warn'); return; }
    trilha.push({id:uid(), alunoId, data:hojeISO(), tipo:'faixa', de:antiga, para:nova, obs});
    a.faixa = nova; a.graus = 0;
  } else {
    const g = Number(a.graus||0);
    trilha.push({id:uid(), alunoId, data:hojeISO(), tipo:'grau', de:String(g), para:String(g+1), obs});
    a.graus = g+1;
  }
  DB.set('alunos', alunos);
  DB.set('trilha', trilha);
  toast('Graduação registrada!','ok');
  closeModal(); renderTrilha();
}

function emitirCertificado(id){

  const blob = new Blob([html], {type:'text/html;charset=utf-8'});

  a.href = URL.createObjectURL(blob);
  a.download = 'certificado_'+al.nome.replace(/\s+/g,'_')+'.html';

let mpTab = 'produtos';
function renderMarketplace(){
  const s = Session.get();
  if(s.perfil==='Professor'){ go('dashboard'); return; }
  setTitle('Loja','Produtos, pedidos e rifas');

  +'</div>';

  else if(mpTab==='pedidos') html += mpPedidos();
  else html += mpRifas();

function mpProdutos(){
  const s = Session.get();
  const produtos = (DB.get('produtos')||[]).filter(p=>p.ativo);
  let html = '';
  if(s.perfil==='Aluno') html += pixBar();

    html += '<div style="margin-bottom:16px;text-align:right"><button class="btn btn-primary" onclick="modalProduto()">'+icon('plus')+' Novo Produto</button></div>';
  }
  html += '<div class="prod-grid">';
  produtos.forEach(p=>{
    html += '<div class="prod-card"><div class="prod-img">'+(p.foto?'<img src="'+p.foto+'" alt="">':'<div class="ph">'+icon('image',30)+'<br>Sem foto</div>')+'</div>'
    +'<div class="prod-body"><h4>'+esc(p.nome)+'</h4><div style="font-size:12px;color:var(--muted)">'+esc(p.desc||'')+'</div>'
    +'<div class="price">'+money(p.preco)+'</div><div class="stock">Estoque: '+p.estoque+' un.</div>'
    +(isFull()
      ? '<div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" onclick="modalProduto(\''+p.id+'\')">'+icon('edit',13)+'</button><button class="btn btn-danger btn-sm" onclick="excluirProduto(\''+p.id+'\')">'+icon('trash',13)+'</button></div>'

    +'</div></div>';
  });
  html += '</div>';
  return html;
}
function mpPedidos(){
  const s = Session.get();
  let pedidos;
  if(s.perfil==='Aluno') pedidos = (DB.get('pedidos')||[]).filter(p=>p.alunoId===currentAlunoId());
  else pedidos = DB.get('pedidos')||[];
  let html = '';
  if(s.perfil==='Aluno') html += pixBar();
  html += '<div class="card"><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th></tr></thead><tbody>';
  if(!pedidos.length) html += '<tr><td colspan="5" style="text-align:center;color:var(--muted)">Nenhum pedido.</td></tr>';
  pedidos.forEach(p=>{
    const al = (DB.get('alunos')||[]).find(a=>a.id===p.alunoId);
    const itens = p.itens.map(i=>{ const pr=(DB.get('produtos')||[]).find(x=>x.id===i.produtoId); return (pr?pr.nome:'Item')+' x'+i.qtd; }).join(', ');
    html += '<tr><td>#'+esc(p.id.slice(-5).toUpperCase())+'</td><td>'+fmtData(p.data)+'</td><td style="font-size:13px">'+esc(itens)+'</td><td>'+money(p.total)+'</td><td><span class="tag tag-blue">'+esc(p.status)+'</span></td></tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}
function mpRifas(){
  const s = Session.get();
  const rifas = DB.get('rifas')||[];
  const bilhetes = DB.get('bilhetes')||[];
  const agora = Date.now();
  const limite60 = 60*86400000;
  const visiveis = rifas.filter(r=>{
    if(isFull()) return true;
    if(r.status==='ativa') return true;
    if(r.status==='sorteada' && r.dataSorteio && (agora - new Date(r.dataSorteio+'T00:00:00').getTime()) < limite60) return true;
    return false;
  });
  let html = '';
  if(s.perfil==='Aluno') html += pixBar();
  html += '<div class="grid grid-2">';
  visiveis.forEach(r=>{
    const bs = bilhetes.filter(b=>b.rifaId===r.id);
    const pagos = bs.filter(b=>b.pago);
    const meus = bs.filter(b=>b.pago && b.alunoId===currentAlunoId());
    const vencedor = r.vencedor ? bs.find(b=>b.id===r.vencedor) : null;
    const vencedorAluno = vencedor ? (DB.get('alunos')||[]).find(a=>a.id===vencedor.alunoId) : null;
    html += '<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';
    html += '<div style="flex:1"><b>'+esc(r.titulo)+'</b><div style="font-size:12px;color:var(--muted)">'+esc(r.premio)+' • Cota: '+money(r.preco)+'</div></div>';
    html += '<span class="tag '+(r.status==='ativa'?'tag-ok':'tag-warn')+'">'+(r.status==='ativa'?'Ativa':'Sorteada')+'</span></div>';
    html += '<div class="raffle-grid" style="margin-bottom:12px">';
    for(let n=1; n<=r.totalBilhetes; n++){
      const b = bs.find(x=>x.numero===n);
      let cls='raffle-cell';
      let onclick='';
      if(b && b.pago){
        cls += ' sold';
        if(meus.some(m=>m.numero===n)) cls += ' mine';
        if(vencedor && vencedor.numero===n) cls += ' winner';
      } else if(r.status==='ativa' && s.perfil==='Aluno'){
        onclick=' onclick="comprarBilhete(\''+r.id+'\','+n+')"';
      }
      html += '<div class="'+cls+'"'+onclick+'>'+n+'</div>';
    }
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center"><span>'+pagos.length+'/'+r.totalBilhetes+' vendidos • Você: '+meus.length+'</span>';
    if(r.status==='sorteada'){
      html += '<span class="tag tag-gold">Vencedor: '+esc(vencedorAluno?vencedorAluno.nome:'-')+' (nº '+ (vencedor?vencedor.numero:'-')+')</span>';
    } else if(isFull() && pagos.length>0){
      html += '<button class="btn btn-gold btn-sm" onclick="sortearRifa(\''+r.id+'\')">'+icon('gift',13)+' Sortear</button>';
    }
    html += '</div>';
    if(isFull()){
      html += '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="modalRifa(\''+r.id+'\')">'+icon('edit',13)+' Editar</button><button class="btn btn-danger btn-sm" onclick="excluirRifa(\''+r.id+'\')">'+icon('trash',13)+' Excluir</button></div>';
    }
    html += '</div>';
  });
  if(!visiveis.length) html = '<div class="alert alert-info">'+icon('info')+'<div>Nenhuma rifa disponível.</div></div>';
  if(isFull()) html += '<div class="card" style="text-align:center"><button class="btn btn-primary" onclick="modalRifa()">'+icon('plus')+' Nova Rifa</button></div>';
  html += '</div>';
  return html;
}
function adicionarCarrinho(produtoId){
  const al = alunoAtual();
  const produtos = DB.get('produtos')||[];
  const p = produtos.find(x=>x.id===produtoId);
  if(!p || p.estoque<=0){ toast('Produto sem estoque.','warn'); return; }
  const pedidos = DB.get('pedidos')||[];
  const novo = {id:uid(), alunoId:al.id, itens:[{produtoId, qtd:1, preco:p.preco}], total:p.preco, status:'pendente', data:hojeISO()};
  pedidos.push(novo);
  p.estoque -= 1;
  DB.set('produtos', produtos);
  DB.set('pedidos', pedidos);
  toast('Produto adicionado ao pedido!');
  renderMarketplace();
}
function modalProduto(id){
  const produtos = DB.get('produtos')||[];
  const p = id? produtos.find(x=>x.id===id):null;
  openModal('<h3>'+(p?'Editar Produto':'Novo Produto')+'<button class="modal-close" onclick="closeModal()">'+icon('sair')+'</button></h3>'
  +'<div class="avatar-upload"><div class="big" id="prFotoPrev" style="border-radius:12px">'+(p&&p.foto?'<img src="'+p.foto+'">':icon('image',26))+'</div><div class="avatar-actions"><button class="btn btn-ghost btn-sm" onclick="uploadFoto(\'prFoto\',\'prFotoPrev\')">'+icon('camera',14)+' Foto do produto</button></div></div>'
  +'<input type="hidden" id="prFoto">'
  +'<div class="form-grid">'
  +'<div class="field full"><label>Nome *</label><input id="prNome" value="'+esc(p?p.nome:'')+'"></div>'
  +'<div class="field full"><label>Descrição</label><input id="prDesc" value="'+esc(p?p.desc:'')+'"></div>'
  +'<div class="field"><label>Preço (R$)</label><input id="prPreco" value="'+(p?p.preco:'')+'" inputmode="decimal"></div>'
  +'<div class="field"><label>Estoque</label><input type="number" id="prEstoque" value="'+(p?p.estoque:10)+'"></div>'
  +'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarProduto(\''+(id||'')+'\')">Salvar</button></div>');
  if(p&&p.foto) document.getElementById('prFoto').value=p.foto;
}
function salvarProduto(id){
  const produtos = DB.get('produtos')||[];
  const nome = document.getElementById('prNome').value.trim();
  if(!nome){ toast('Informe o nome.','warn'); return; }
  const preco = parseFloat(String(document.getElementById('prPreco').value).replace(',','.'))||0;
  const dados = { nome, desc:document.getElementById('prDesc').value.trim(), preco, estoque:Number(document.getElementById('prEstoque').value)||0, foto:document.getElementById('prFoto').value, ativo:true };
  if(id){ Object.assign(produtos.find(x=>x.id===id), dados); DB.set('produtos', produtos); toast('Produto atualizado.','ok'); }
  else { produtos.push({id:uid(), ...dados}); DB.set('produtos', produtos); toast('Produto cadastrado.','ok'); }
  closeModal(); renderMarketplace();
}
function excluirProduto(id){
  if(!isFull()) return;
  if(!confirm('Excluir produto?')) return;
  DB.set('produtos', (DB.get('produtos')||[]).filter(p=>p.id!==id));
  toast('Produto excluído.'); renderMarketplace();
}
function modalRifa(id){
  const rifas = DB.get('rifas')||[];
  const r = id? rifas.find(x=>x.id===id):null;
  openModal('<h3>'+(r?'Editar Rifa':'Nova Rifa')+'<button class="modal-close" onclick="closeModal()">'+icon('sair')+'</button></h3>'
  +'<div class="form-grid">'
  +'<div class="field full"><label>Título *</label><input id="rfTitulo" value="'+esc(r?r.titulo:'')+'"></div>'
  +'<div class="field full"><label>Prêmio</label><input id="rfPremio" value="'+esc(r?r.premio:'')+'"></div>'
  +'<div class="field"><label>Valor da cota (R$)</label><input id="rfPreco" value="'+(r?r.preco:10)+'" inputmode="decimal"></div>'
  +'<div class="field"><label>Total de bilhetes</label><input type="number" id="rfTotal" value="'+(r?r.totalBilhetes:100)+'"></div>'
  +'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarRifa(\''+(id||'')+'\')">Salvar</button></div>');
}
function salvarRifa(id){
  const rifas = DB.get('rifas')||[];
  const titulo = document.getElementById('rfTitulo').value.trim();
  if(!titulo){ toast('Informe o título.','warn'); return; }
  const preco = parseFloat(String(document.getElementById('rfPreco').value).replace(',','.'))||0;
  const total = Number(document.getElementById('rfTotal').value)||100;
  if(id){
    const r = rifas.find(x=>x.id===id);
    Object.assign(r, {titulo, preco, totalBilhetes:total, premio:document.getElementById('rfPremio').value.trim()});
    DB.set('rifas', rifas);
    toast('Rifa atualizada.','ok');
  } else {
    const nova = {id:uid(), titulo, preco, totalBilhetes:total, premio:document.getElementById('rfPremio').value.trim(), status:'ativa', dataSorteio:null, vencedor:null, criadoEm:hojeISO()};
    rifas.push(nova);
    DB.set('rifas', rifas);
    toast('Rifa criada.','ok');
  }
  closeModal(); renderMarketplace();
}
function excluirRifa(id){
  if(!isFull()) return;
  if(!confirm('Excluir rifa?')) return;
  DB.set('rifas', (DB.get('rifas')||[]).filter(r=>r.id!==id));
  DB.set('bilhetes', (DB.get('bilhetes')||[]).filter(b=>b.rifaId!==id));
  toast('Rifa excluída.'); renderMarketplace();
}
function comprarBilhete(rifaId, numero){
  const al = alunoAtual();
  const bilhetes = DB.get('bilhetes')||[];
  if(bilhetes.some(b=>b.rifaId===rifaId && b.numero===numero && b.pago)){ toast('Bilhete já vendido.','warn'); return; }
  const b = bilhetes.find(x=>x.rifaId===rifaId && x.numero===numero && !x.pago);
  if(b){ b.alunoId=al.id; b.pago=true; }
  else bilhetes.push({id:uid(), rifaId, numero, alunoId:al.id, pago:true});
  DB.set('bilhetes', bilhetes);
  toast('Bilhete '+numero+' comprado!','ok');
  renderMarketplace();
}
function sortearRifa(rifaId){
  if(!isFull()) return;
  const rifas = DB.get('rifas')||[];
  const bilhetes = DB.get('bilhetes')||[];
  const r = rifas.find(x=>x.id===rifaId);
  const pagos = bilhetes.filter(b=>b.rifaId===rifaId && b.pago);
  if(!pagos.length){ toast('Nenhum bilhete pago para sortear.','warn'); return; }
  if(!confirm('Confirmar sorteio eletrônico da rifa "'+r.titulo+'"?')) return;
  const vencedor = pagos[Math.floor(Math.random()*pagos.length)];
  r.status='sorteada'; r.dataSorteio=hojeISO(); r.vencedor=vencedor.id;
  DB.set('rifas', rifas);
  const al = (DB.get('alunos')||[]).find(a=>a.id===vencedor.alunoId);
  toast('Sorteio realizado! Vencedor: '+(al?al.nome:'-')+' (nº '+vencedor.numero+').','ok');
  renderMarketplace();
}

function renderAvisos(){

    html += '<div style="margin-bottom:16px;text-align:right"><button class="btn btn-primary" onclick="modalAviso()">'+icon('plus')+' Novo Aviso</button></div>';
  }
  const avisos = DB.get('avisos')||[];
  html += '<div class="card">';
  avisos.slice().sort((a,b)=>b.data.localeCompare(a.data)).forEach(a=>{
    const isAluno = s.perfil==='Aluno';
    const unread = isAluno && !a.lidos.includes(currentAlunoId());
    html += '<div class="notice'+(unread?' unread':'')+'"><div class="n-head">'
    +(unread?'<span class="tag tag-danger">Nova</span>':'')

    +'<div class="n-body">'+esc(a.corpo)+'</div>'

    +(isStaff()?'<button class="btn btn-danger btn-sm" style="margin-top:8px;margin-left:8px" onclick="excluirAviso(\''+a.id+'\')">'+icon('trash',13)+'</button>':'')
    +'</div>';

  if(!avisos.length) html += '<p style="color:var(--muted)">Nenhum aviso.</p>';

}
function modalAviso(){
  const alunos = DB.get('alunos')||[];
  openModal('<h3>Novo Aviso<button class="modal-close" onclick="closeModal()">'+icon('sair')+'</button></h3>'
  +'<div class="form-grid">'
  +'<div class="field full"><label>Título *</label><input id="avTitulo"></div>'
  +'<div class="field full"><label>Mensagem *</label><textarea id="avCorpo" rows="3"></textarea></div>'
  +'<div class="field full"><label>Destino</label><label style="display:flex;gap:14px;align-items:center;text-transform:none;font-weight:400;font-size:14px"><input type="radio" name="avAlvo" value="todos" checked style="width:auto"> Todos</label>'
  +'<div style="margin-top:6px"><label style="display:flex;gap:14px;align-items:center;text-transform:none;font-weight:400;font-size:14px"><input type="radio" name="avAlvo" value="alunos" style="width:auto"> Alunos específicos</label></div>'
  +'<div id="avAlunosSel" style="display:none;margin-top:8px"><label>Selecione alunos</label><select id="avAlunos" multiple size="4" style="height:auto">'+alunos.map(a=>'<option value="'+a.id+'">'+esc(a.nome)+'</option>').join('')+'</select></div></div>'
  +'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarAviso()">Publicar</button></div>');
  document.querySelectorAll('input[name=avAlvo]').forEach(r=>r.addEventListener('change', ()=>{
    document.getElementById('avAlunosSel').style.display = r.value==='alunos'?'block':'none';
  }));

function salvarAviso(){
  const avisos = DB.get('avisos')||[];
  const titulo = document.getElementById('avTitulo').value.trim();
  const corpo = document.getElementById('avCorpo').value.trim();
  if(!titulo || !corpo){ toast('Preencha título e mensagem.','warn'); return; }
  const alvo = document.querySelector('input[name=avAlvo]:checked').value;
  const aviso = {id:uid(), titulo, corpo, data:hojeISO(), autor:Session.get().nome, alvo, lidos:[]};
  if(alvo==='alunos'){
    const sel = document.querySelectorAll('#avAlunos option:checked');
    aviso.alvoAlunos = Array.from(sel).map(o=>o.value);
  }
  avisos.push(aviso);
  DB.set('avisos', avisos);
  toast('Aviso publicado.','ok');
  closeModal(); renderAvisos();
}
function marcarLido(id){
  const avisos = DB.get('avisos')||[];
  const a = avisos.find(x=>x.id===id);
  const alId = currentAlunoId();
  if(a && !a.lidos.includes(alId)) a.lidos.push(alId);
  DB.set('avisos', avisos);
  renderAvisos(); renderNav();
}
function excluirAviso(id){
  if(!isStaff()) return;
  if(!confirm('Excluir aviso?')) return;
  DB.set('avisos', (DB.get('avisos')||[]).filter(a=>a.id!==id));
  toast('Aviso excluído.'); renderAvisos();
}

/* ============ RELATÓRIOS ============ */
function renderRelatorios(){
  if(!isFull()) return;
  setTitle('Relatórios','Métricas e exportação');
  const alunos = DB.get('alunos')||[];
  const turmas = DB.get('turmas')||[];
  const mensalidades = DB.get('mensalidades')||[];
  const presencas = DB.get('presencas')||[];
  const pedidos = DB.get('pedidos')||[];
  const ativos = alunos.filter(a=>a.ativo).length;
  const inad = alunos.filter(a=>mensalidades.some(m=>m.alunoId===a.id&&m.status==='aberto')).length;
  const porFaixa = {};
  alunos.forEach(a=>{ porFaixa[a.faixa]=(porFaixa[a.faixa]||0)+1; });
  const presencasMes = presencas.filter(p=>p.data.startsWith(hojeISO().slice(0,7)));
  const presentes = presencasMes.filter(p=>p.presente).length;
  const receitaMensalidades = mensalidades.filter(m=>m.status==='pago').reduce((s,m)=>s+m.valor,0);
  const receitaLoja = pedidos.reduce((s,p)=>s+p.total,0);
  let html = '<div class="grid grid-4">';
  html += statCard('Alunos Ativos', ativos, 'alunos', '#3498db');
  html += statCard('Inadimplentes', inad, 'warn', '#f39c12');
  html += statCard('Presenças (mês)', presentes+'/'+presencasMes.length, 'check', '#2ecc71');
  html += statCard('Receita Total', money(receitaMensalidades+receitaLoja), 'financeiro', '#f9c80e');
  html += '</div>';
  html += '<div class="grid grid-2">';
  html += '<div class="card"><h3>'+icon('trilha')+'Alunos por Faixa</h3><div class="table-wrap"><table><thead><tr><th>Faixa</th><th>Quantidade</th></tr></thead><tbody>';
  FAIXA_ORDEM.forEach(f=>{
    if(porFaixa[f]) html += '<tr><td><span class="belt-chip"><span class="belt-bar" style="background:'+FAIXAS_IBJJF[f].hex+'"></span>'+f+'</span></td><td>'+porFaixa[f]+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  html += '<div class="card"><h3>'+icon('presencas')+'Presenças por Turma</h3>'+presencaBars(turmas, presencas)+'</div>';
  html += '</div>';
  html += '<div class="card"><h3>'+icon('download')+'Exportações</h3>'
  +'<div style="display:flex;flex-direction:column;gap:10px">'
  +'<button class="btn btn-ghost" onclick="exportarAlunosCSV()">'+icon('download')+' Exportar Alunos (CSV)</button>'
  +'<button class="btn btn-ghost" onclick="exportarFinanceiroCSV()">'+icon('download')+' Exportar Financeiro (CSV)</button>'
  +'<button class="btn btn-ghost" onclick="exportarPresencasCSV()">'+icon('download')+' Exportar Presenças (CSV)</button>'
  +'</div></div>';
  document.getElementById('content').innerHTML = html;
}
function exportarAlunosCSV(){
  const alunos = DB.get('alunos')||[];
  let csv = 'Nome;CPF;Email;Celular;Nascimento;Faixa;Graus;Status\n';
  alunos.forEach(a=>csv += a.nome+';'+(a.cpf||'')+';'+(a.email||'')+';'+(a.celular||'')+';'+(a.nascimento||'')+';'+a.faixa+';'+a.graus+';'+(a.ativo?'Ativo':'Inativo')+'\n');
  downloadCSV(csv, 'alunos_'+hojeISO()+'.csv');
  toast('Exportação gerada.','ok');
}
function exportarFinanceiroCSV(){
  const mensalidades = DB.get('mensalidades')||[];
  let csv = 'Aluno;Referencia;Valor;Status;DataPagamento\n';
  mensalidades.forEach(m=>{ const al=(DB.get('alunos')||[]).find(a=>a.id===m.alunoId); csv += (al?al.nome:'-')+';'+m.mes+';'+m.valor+';'+m.status+';'+(m.dataPag||'')+'\n'; });
  downloadCSV(csv, 'financeiro_'+hojeISO()+'.csv');
  toast('Exportação gerada.','ok');
}
function exportarPresencasCSV(){
  const presencas = DB.get('presencas')||[];
  let csv = 'Aluno;Turma;Data;Presente\n';
  presencas.forEach(p=>{ const al=(DB.get('alunos')||[]).find(a=>a.id===p.alunoId); const t=(DB.get('turmas')||[]).find(x=>x.id===p.turmaId); csv += (al?al.nome:'-')+';'+(t?t.nome:'-')+';'+p.data+';'+(p.presente?'Sim':'Não')+'\n'; });
  downloadCSV(csv, 'presencas_'+hojeISO()+'.csv');
  toast('Exportação gerada.','ok');
}

  +'<div class="form-grid">'

  +'<div class="field"><label>Nova senha (mín. 6 dígitos)</label><input type="password" id="pwNova"></div>'
  +'<div class="field"><label>Confirmar nova senha</label><input type="password" id="pwConf"></div>'
  +'</div>'
  +'<div style="margin-top:16px"><button class="btn btn-gold" onclick="alterarSenha()">'+icon('check')+' Alterar senha</button></div>'

function salvarPerfil(){
  const s = Session.get();
  const users = DB.get('users')||[];
  const user = users.find(u=>u.id===s.id);
  const nome = document.getElementById('perfNome').value.trim();
  const email = document.getElementById('perfEmail').value.trim();
  const foto = document.getElementById('perfFoto').value;
  if(!nome){ toast('Informe o nome.','warn'); return; }
  if(user){
    user.nome=nome; user.email=email; user.foto=foto;
    DB.set('users', users);
    if(user.alunoId){
      const alunos = DB.get('alunos')||[];
      const a = alunos.find(x=>x.id===user.alunoId);
      if(a){ a.nome=nome; a.email=email; a.foto=foto; DB.set('alunos', alunos); }
    }
    Session.set(user);
    renderNav();
  }
  toast('Perfil atualizado.','ok');
  renderPerfil();
}
function alterarSenha(){
  const s = Session.get();
  const users = DB.get('users')||[];
  const user = users.find(u=>u.id===s.id);
  const atual = document.getElementById('pwAtual').value;
  const nova = document.getElementById('pwNova').value;
  const conf = document.getElementById('pwConf').value;
  const msg = document.getElementById('pwMsg');
  msg.innerHTML='';
  if(user.senha!==atual){ msg.innerHTML='<div class="alert alert-danger">'+icon('warn')+'<div>Senha atual incorreta.</div></div>'; return; }
  if(nova.length<6){ msg.innerHTML='<div class="alert alert-danger">'+icon('warn')+'<div>A nova senha deve ter no mínimo 6 dígitos.</div></div>'; return; }
  if(nova!==conf){ msg.innerHTML='<div class="alert alert-danger">'+icon('warn')+'<div>As senhas não coincidem.</div></div>'; return; }
  user.senha = nova;
  DB.set('users', users);
  Session.set(user);
  document.getElementById('pwAtual').value=''; document.getElementById('pwNova').value=''; document.getElementById('pwConf').value='';
  msg.innerHTML='<div class="alert alert-ok">'+icon('check')+'<div>Senha alterada com sucesso.</div></div>';
  toast('Senha alterada!','ok');
}

    +'</div>';
  } else {
    html += '<div class="alert alert-warn">'+icon('warn')+'<div>Limite de 5 dependentes atingido.</div></div>';
  }
  document.getElementById('content').innerHTML = html;
}
function adicionarDependente(){
  const s = Session.get();
  const alunos = DB.get('alunos')||[];
  const titular = alunos.find(a=>a.id===s.alunoId);
  if(!titular.dependentes) titular.dependentes=[];
  if(titular.dependentes.length>=5){ toast('Limite de 5 dependentes.','warn'); return; }
  const nome = document.getElementById('depNome').value.trim();
  if(!nome){ toast('Informe o nome.','warn'); return; }
  const novo = {id:uid(), nome, cpf:'', email:'', celular:'', nascimento:document.getElementById('depNasc').value, faixa:document.getElementById('depFaixa').value, graus:0, ativo:true, foto:'', dependentes:[], dependenteDe:'dependente de '+titular.nome, nota:''};
  alunos.push(novo);
  titular.dependentes.push(novo.id);
  DB.set('alunos', alunos);
  toast('Dependente vinculado.','ok');
  renderDependentes(); renderNav();
}
function removerDependente(depId){
  if(!confirm('Remover este dependente?')) return;
  const alunos = DB.get('alunos')||[];
  const s = Session.get();
  const titular = alunos.find(a=>a.id===s.alunoId);
  titular.dependentes = titular.dependentes.filter(d=>d!==depId);
  DB.set('alunos', alunos.filter(d=>d.id!==depId));
  if(current.depId===depId) current.depId=null;
  toast('Dependente removido.');
  renderDependentes(); renderNav();
}

/* ============ INICIALIZAÇÃO ============ */
function init(){
  DB.init();
  applyWhiteLabel();
  let s = Session.get();
  if(s){
    const users = DB.get('users')||[];
    if(!users.some(u=>u.id===s.id)){ Session.clear(); s = null; }
  }
  if(s){
    document.getElementById('loginView').style.display='none';
    document.getElementById('appView').style.display='flex';
    renderNav();
    go('dashboard');
  } else {
    document.getElementById('loginView').style.display='flex';
    document.getElementById('appView').style.display='none';
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
